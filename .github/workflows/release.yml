# Sentinel release pipeline (M11.1, ADR-030) — closes the GAP-SEC-002 signed-release tail.
#
# ⚠ Числа ниже ВЫВЕДЕНЫ из самого файла 2026-08-15, а не переписаны: список бинарей — цикл
# `for c in …` в шаге сборки, платформы — `matrix.include`. Шапка говорила «5 бинарей × 6 платформ
# (30)» с тех пор, как ADR-119 удалил `report-service`: и сомножитель, и произведение были ложью, а
# читал её тот, кто хотел понять, что вообще уезжает пользователю.
#
# On a `v*` tag: build 4 Go binaries × 6 platforms (24) plus a .deb per Linux arch, a multi-arch Docker
# image (GHCR), a CycloneDX SBOM, Cosign KEYLESS signatures (Sigstore OIDC — no long-lived key/secret),
# and a GitHub Release with every asset attached. `workflow_dispatch` runs a build/SBOM DRY-RUN (no push
# / no sign / no release), so the pipeline can be smoke-tested without cutting a tag.
#
# ADR-110, from the v0.1.0-rc1 rehearsal — the first time this pipeline had ever fired. What it found:
#   * a `-rc1` tag produced a Release marked prerelease=FALSE, so /releases/latest resolved to it and
#     install.sh would have handed a rehearsal to anyone running the documented one-liner. The image
#     tags already had this distinction (`:latest` only for a dash-free tag); the Release did not.
#   * the homebrew job pushed straight to `main` and could NEVER have succeeded: the branch requires
#     verified signatures, a pull request, and passing checks — the bot commit fails all three. The
#     job was `continue-on-error`, so the pipeline stayed green while the formula stayed at v0.0.0.
#
# NOTE: repo convention is SHA-pinned actions. The @vN tags below should be SHA-pinned by a
# Dependabot / hardening pass (kept as version tags here — SHAs are not invented).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/alexgromer/sentinel

jobs:
  binaries:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Build + package binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then TAG="${GITHUB_REF_NAME}"; else TAG="dev-${GITHUB_SHA::7}"; fi
          out="sentinel-${TAG}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${out}"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          for c in agentctl control-api orchestrator store-gateway; do
            go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/${out}/${c}${ext}" "./cmd/${c}"
          done
          cp LICENSE README.md "dist/${out}/" 2>/dev/null || true
          tar -C dist -czf "dist/${out}.tar.gz" "${out}"
      # ADR-110: a .deb per Linux arch, from the binaries just built. Runs in the DRY-RUN too — a
      # packaging step that only ever executes on a tag is a step nobody has tested when it matters.
      # A Debian version may not begin with a letter, so the dry-run's `dev-<sha>` becomes
      # 0.0.0+dev.<sha> rather than being skipped.
      - name: Build .deb (linux only)
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then TAG="${GITHUB_REF_NAME}"; VER="${GITHUB_REF_NAME#v}"
          else TAG="dev-${GITHUB_SHA::7}"; VER="0.0.0+dev.${GITHUB_SHA::7}"; fi
          sh scripts/build-deb.sh "$VER" "${{ matrix.goarch }}" "dist/sentinel-${TAG}-linux-${{ matrix.goarch }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  image:
    name: docker + sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR push (tag only)
      id-token: write   # cosign keyless
    steps:
      - uses: actions/checkout@v7
      - name: Resolve tag / push mode / image tags
        id: meta
        run: |
          set -euo pipefail
          # PUBLISH only on a real tag PUSH. A workflow_dispatch (even if 'Run workflow' selects a tag
          # ref -> GITHUB_REF_TYPE=tag) MUST stay a dry-run, so gate on the EVENT, not just the ref.
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF_TYPE}" = tag ]; then
            TAG="${GITHUB_REF_NAME}"; PUSH=true
          else
            TAG="dev-${GITHUB_SHA::7}"; PUSH=false
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          # image tags: always the version; :latest ONLY for a non-prerelease (no '-' in the tag), so an
          # RC (v1.0.0-rc1) or a backdated hotfix tag never clobbers the stable :latest channel.
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            case "${TAG}" in *-*) : ;; *) echo "${IMAGE}:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (+ push on tag) multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # ⚠ NAMED, not left to the default — see the same comment in ci.yml. This is the site where
          # the omission would have cost the most: an unnamed target here publishes whatever stage
          # happens to be last to `ghcr.io/.../sentinel:<tag>` and `:latest`, under a version number
          # that promises the image people already run.
          target: runtime
          # dry-run builds a single arch (fast Dockerfile smoke); a tag builds + pushes both.
          platforms: ${{ steps.meta.outputs.push == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # ADR-110: the image's binaries carry the tag too. Until this existed, the tarballs were
          # stamped and the image was not, so a published `:latest` answered "dev" to --version.
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
      - name: Install cosign
        if: steps.meta.outputs.push == 'true'
        uses: sigstore/cosign-installer@v4.1.2   # v3 cannot install cosign v3.x (stale v2.x); v4 installs current cosign
      - name: Sign image (keyless)
        if: steps.meta.outputs.push == 'true'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      - name: SBOM (CycloneDX — the pushed image on a tag, else the source tree)
        run: |
          set -euo pipefail
          if [ "${{ steps.meta.outputs.push }}" = true ]; then
            syft scan "${IMAGE}@${{ steps.build.outputs.digest }}" -o cyclonedx-json=sbom.cdx.json
          else
            syft scan dir:. -o cyclonedx-json=sbom.cdx.json
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  release:
    name: github release
    needs: [binaries, image]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release
      id-token: write   # cosign keyless sign-blob
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: art
          merge-multiple: true
      - name: Gather assets + checksums
        run: |
          set -euo pipefail
          mkdir -p rel
          find art -name '*.tar.gz' -exec cp {} rel/ \;
          find art -name '*.deb'    -exec cp {} rel/ \;
          find art -name 'sbom.cdx.json' -exec cp {} rel/ \;
          # The .deb glob is NOT optional: a release that silently shipped without it would look
          # complete, and the only symptom is `apt install` 404-ing for whoever followed the docs.
          ls rel/*.deb >/dev/null || { echo "::error::no .deb assets reached the release job"; exit 1; }
          cd rel && sha256sum *.tar.gz *.deb sbom.cdx.json > checksums.sha256
      - uses: sigstore/cosign-installer@v4.1.2   # v3 cannot install cosign v3.x (stale v2.x); v4 installs current cosign
      - name: Sign archives + checksums (keyless)
        working-directory: rel
        run: |
          set -euo pipefail
          for f in *.tar.gz *.deb sbom.cdx.json checksums.sha256; do
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ADR-110: a tag carrying a pre-release suffix (v1.0.0-rc1) MUST be marked as one. Without
          # this, /releases/latest returns it — and install.sh resolves `latest` through exactly that
          # endpoint, so a rehearsal became what the documented one-liner installed. The image tags
          # had this distinction from the start (`:latest` only for a dash-free tag); the Release did
          # not, and the rc1 rehearsal is what surfaced the asymmetry.
          case "${GITHUB_REF_NAME}" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "${GITHUB_REF_NAME}" --generate-notes --repo "${GITHUB_REPOSITORY}" ${PRE} \
            rel/*.tar.gz rel/*.deb rel/checksums.sha256 rel/*.cosign.bundle rel/sbom.cdx.json

  # Bump the Homebrew formula (macOS) to the released darwin archives, VIA A PULL REQUEST.
  # This repo doubles as its own tap: `brew tap AlexGromer/sentinel <repo> && brew install sentinel`.
  #
  # It used to push straight to `main`, and the v0.1.0-rc1 rehearsal proved that could never have
  # worked — the branch rejected it on three counts at once:
  #     remote: - Commits must have verified signatures.
  #     remote: - Changes must be made through a pull request.
  #     remote: - 4 of 4 required status checks are expected.
  # With `continue-on-error: true` on the job, none of that was visible: the pipeline stayed green
  # and the formula stayed at its v0.0.0 placeholder, so `brew install` failed its checksum on
  # purpose forever. A PR clears all three — a squash merge is authored by GitHub and therefore
  # signed, which is how Dependabot's unsigned commits already land here.
  #
  # No longer continue-on-error: a formula that did not get bumped is a broken install path, and
  # this job existing to hide that fact is what let it stay broken.
  homebrew:
    name: bump homebrew formula
    needs: release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the bump branch
      pull-requests: write   # open the PR that carries it to main
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          path: art
          merge-multiple: true
      - name: Regenerate Formula/sentinel.rb from the darwin archives + open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          amd="$(sha256sum "art/sentinel-${TAG}-darwin-amd64.tar.gz" | cut -d' ' -f1)"
          arm="$(sha256sum "art/sentinel-${TAG}-darwin-arm64.tar.gz" | cut -d' ' -f1)"
          sh scripts/gen-brew-formula.sh "$TAG" "$amd" "$arm"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sentinel.rb
          git commit -m "chore(brew): bump sentinel formula to ${TAG}" || { echo "no formula change"; exit 0; }
          branch="brew-bump/${TAG}"
          git push --force origin "HEAD:refs/heads/${branch}"
          # Body via a heredoc, not an inline string: the YAML block scalar strips this block's
          # indentation, so the lines reach Markdown flush-left either way — but a heredoc keeps
          # backticks and quotes out of shell-quoting range.
          cat > /tmp/brew-pr-body.md <<EOF
          Generated by the \`homebrew\` job of the ${TAG} release run.

          \`Formula/sentinel.rb\` now points at the ${TAG} darwin archives with their real sha256s;
          until this merges, \`brew install sentinel\` fails its checksum against the v0.0.0
          placeholder — which is the placeholder doing its job, not a bug.

          Merge with **squash**: the branch commit is an unsigned bot commit, and \`main\` requires
          verified signatures. A squash merge is authored (and signed) by GitHub.
          EOF
          gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${branch}" \
            --title "chore(brew): bump sentinel formula to ${TAG}" \
            --body-file /tmp/brew-pr-body.md
