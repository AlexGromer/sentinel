# Sentinel CI — M3 "CI-Ready Replay / Trust Layer" (see docs/M3_CONTRACT.md §GitHub Actions).
#
# Pipeline shape:
#   build   -> compiles all three components (Go agentctl, TS pw-executor, Python brain deps),
#              runs `go vet` + `go test ./...` + the Python offline suite (m3..m9_2b), and
#              publishes a reusable build artifact.
#   security-> deterministic gates on push/PR: gitleaks (HARD, secrets) + pip-audit (advisory,
#              Python). The live-DB supply-chain scanners (govulncheck + npm audit) run nightly
#              in security-nightly.yml (#8) so a fresh upstream CVE can't redden an unrelated PR.
#   replay  -> matrix over the two fixtures; explores `testdata/site` to produce a plan,
#              freezes goldens from it, then replays against each matrix target with --ci
#              and ASSERTS the structured exit code (site -> 0, site-v2 -> 2 per the contract).
#   explore -> manual (workflow_dispatch) only; produces a downloadable plan.json artifact.
#
# The `security` job closes the docs-vs-reality gap (gitleaks was documented but absent from CI)
# and partially closes GAP-SEC-002 (supply-chain). The offline-suite + go test steps were run
# locally before this workflow was committed.
name: ci

on:
  push:
  pull_request:
  # Manual trigger drives the `explore` job (gated below on event_name).
  workflow_dispatch:

# Least-privilege default token: no job needs more than read — artifact up/download use the
# Actions runtime token, and gitleaks only reads. Override per-job if a step ever needs write.
permissions:
  contents: read

# One in-flight run per ref; newer pushes cancel stale CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # build: compile everything once, publish bin/ + pw-executor/dist/ as artifact.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go 1.26 (control-plane / agentctl)
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Set up Node 24 (pw-executor)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install uv (Python env/dep manager for the brain)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Build pw-executor (TypeScript -> dist/server.js)
        run: |
          cd pw-executor
          npm ci
          npm run build

      # Browsers land in the machine-global Playwright cache (~/.cache/ms-playwright),
      # so the server resolves them at runtime regardless of cwd.
      - name: Install Playwright browser (chromium-headless-shell)
        run: cd pw-executor && npx playwright install --with-deps chromium-headless-shell

      - name: Build agentctl (Go)
        run: go build -o bin/agentctl ./cmd/agentctl

      - name: Vet + unit test (Go)
        run: |
          go vet ./...
          go test ./...

      - name: SPA syntax check (docs/index.html inline JS — node --check floor gate, M15)
        run: |
          python3 - <<'PY'
          import re
          html = open('docs/index.html').read()
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S)
          open('/tmp/spa_check.js', 'w').write('\n;\n'.join(blocks))
          print('inline <script> blocks:', len(blocks))
          PY
          node --check /tmp/spa_check.js

      - name: Provision brain venv (frozen install from brain/uv.lock — #38)
        run: UV_PROJECT_ENVIRONMENT="$PWD/.venv" uv sync --frozen --project brain

      - name: Python offline suite (m3..m9_2b + r2_multiturn + r3_takeover + determinism + record_bridge + sanitize + m13_chats + m14_agui + m_structured_out + m11_4 — FakeBackend/FakeExecutor, no network)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e
          for t in m3 m4 m4b m5 b1 m7 m8 m9 m9_2 m9_2b r2_multiturn r3_takeover determinism record_bridge sanitize m13_chats m14_agui m_structured_out m11_4; do
            echo "== test_${t}_offline =="
            .venv/bin/python tests/test_${t}_offline.py
          done

      # Ship only compiled outputs; node_modules / browsers / .venv are reinstalled
      # by downstream jobs (cheaper than dragging them through artifact storage).
      - name: Upload build artifact (bin/ + pw-executor/dist/)
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-build
          path: |
            bin/
            pw-executor/dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # replay: per-fixture deterministic replay with golden-diff, asserting exit code.
  # Plans live in git-ignored runs/, so we explore fresh here, freeze goldens, replay.
  # Per-job SQLite (M3_CONTRACT §GitHub Actions) — each matrix leg is isolated.
  # ---------------------------------------------------------------------------
  replay:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # run both legs even if one fails, for full signal
      matrix:
        target: [site, site-v2]   # site -> expect exit 0, site-v2 -> expect exit 2
    steps:
      - uses: actions/checkout@v7   # provides testdata/, brain/, lockfiles

      - name: Set up Node 24 (runtime for pw-executor)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install uv (brain runtime deps)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      # Restores bin/agentctl and pw-executor/dist/ at the repo root.
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: sentinel-build

      - name: Make agentctl executable
        run: chmod +x bin/agentctl

      # dist/ comes from the artifact; npm ci only restores the runtime node_modules
      # (the pw-executor imports `playwright` at runtime). No rebuild needed.
      - name: Restore pw-executor runtime deps
        run: cd pw-executor && npm ci

      - name: Install Playwright browser (chromium-headless-shell)
        run: cd pw-executor && npx playwright install --with-deps chromium-headless-shell

      - name: Provision brain venv (frozen install from brain/uv.lock — #38)
        run: UV_PROJECT_ENVIRONMENT="$PWD/.venv" uv sync --frozen --project brain

      # Explore -> baseline -> replay. The heuristic planner is deterministic and
      # needs no ANTHROPIC_API_KEY; replay runs without --heal-llm for the same reason.
      - name: Explore + freeze goldens + replay (assert exit code)
        env:
          AUT_SHA: ${{ github.sha }}   # AUT-SHA-gated flake quarantine input
        run: |
          set -e   # any precondition (explore / baseline) failing aborts the job

          # 1) Explore the ORIGINAL site to produce a frozen plan at a known path.
          ./bin/agentctl run \
            --target "file://$PWD/testdata/site/index.html" \
            --artifact-dir "runs/ci" \
            --planner heuristic

          PLAN="runs/ci/plan.json"
          test -s "$PLAN"   # plan must exist and be non-empty

          # 2) Freeze dual goldens (a11y-hash + screenshot-hash) from the original site.
          #    This is the ONLY golden mutation path; the replay below never writes goldens.
          ./bin/agentctl baseline update \
            --plan "$PLAN" \
            --target "file://$PWD/testdata/site/index.html"

          # 3) Replay against this matrix leg's target with --ci (forbids --force-replay).
          #    Capture the exit code WITHOUT aborting under set -e.
          set +e
          ./bin/agentctl run --replay \
            --plan "$PLAN" \
            --target "file://$PWD/testdata/${{ matrix.target }}/index.html" \
            --aut-version "$AUT_SHA" \
            --ci
          code=$?
          set -e

          # 4) Assert the structured exit code per docs/M3_CONTRACT.md.
          case "${{ matrix.target }}" in
            site)    expected=0 ;;   # unchanged DOM: no heal, no golden regression
            site-v2) expected=2 ;;   # drifted DOM: heals + golden-diff regression
            *)       echo "::error::unknown matrix target ${{ matrix.target }}"; exit 1 ;;
          esac

          if [ "$code" -ne "$expected" ]; then
            echo "::error::replay against '${{ matrix.target }}' exited $code, expected $expected"
            exit 1
          fi
          echo "OK: replay against '${{ matrix.target }}' exited $code (expected $expected)"

      # Heal/golden-diff report is useful for debugging a failed assertion.
      - name: Upload replay report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heal-report-${{ matrix.target }}
          path: runs/ci/heal-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # explore: MANUAL only (workflow_dispatch). Produces a fresh plan.json for download
  # (e.g. to seed a baseline update locally). Not part of push/PR gating.
  # ---------------------------------------------------------------------------
  explore:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24 (runtime for pw-executor)
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install uv (brain runtime deps)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: sentinel-build

      - name: Make agentctl executable
        run: chmod +x bin/agentctl

      - name: Restore pw-executor runtime deps
        run: cd pw-executor && npm ci

      - name: Install Playwright browser (chromium-headless-shell)
        run: cd pw-executor && npx playwright install --with-deps chromium-headless-shell

      - name: Provision brain venv (frozen install from brain/uv.lock — #38)
        run: UV_PROJECT_ENVIRONMENT="$PWD/.venv" uv sync --frozen --project brain

      - name: Explore testdata/site -> plan.json
        run: |
          set -e
          ./bin/agentctl run \
            --target "file://$PWD/testdata/site/index.html" \
            --artifact-dir "runs/explore" \
            --planner heuristic
          test -s runs/explore/plan.json

      - name: Upload plan.json artifact
        uses: actions/upload-artifact@v7
        with:
          name: plan
          path: runs/explore/plan.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # security: DETERMINISTIC gates only — gitleaks (HARD, secrets scan over full history)
  # + pip-audit (advisory, over the committed brain/uv.lock) + a CycloneDX SBOM artifact (#38). The
  # live-advisory-DB scanners (govulncheck + npm audit) moved to security-nightly.yml (#8) so PR/push
  # greenness never hinges on a freshly published upstream CVE. Runs in parallel with build.
  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans the full history, not just the tip

      - name: gitleaks (secrets scan — HARD fail)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: pip-audit (Python deps — advisory; audits the committed lock)
        continue-on-error: true   # advisory: a newly published CVE against the pinned lock must not redden an unrelated PR (#8)
        run: |
          uv export --frozen --no-dev --no-emit-project --project brain --format requirements-txt > requirements.lock
          uvx pip-audit -r requirements.lock

      - name: Upload Python dependency freeze (advisory artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-requirements-lock
          path: requirements.lock
          if-no-files-found: warn

      - name: SBOM (CycloneDX, from the frozen lock — #38)
        run: |
          uv export --frozen --no-dev --no-emit-project --project brain --format requirements-txt > sbom-requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements sbom-requirements.txt -o sbom.cdx.json

      - name: Upload SBOM (CycloneDX)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # bilingual: docs parity gate — every primary *.md must have a *.en.md pair,
  # and every *.en.md must have a primary sibling (no orphans). Runs in parallel
  # with build and security (no needs:). Pure Python stdlib; no venv required.
  # ---------------------------------------------------------------------------
  bilingual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check bilingual docs parity
        run: python3 scripts/check_bilingual.py

  # ---------------------------------------------------------------------------
  # airgap: M11.4 — the FIRST job to exercise the Dockerfile in CI. Builds sentinel:local, round-trips
  # it through `docker save`/`docker load`, and proves the RUNTIME makes zero external calls via
  # scripts/offline-verify.sh --local (agentctl under --network none, the LLM-free demo explores, the
  # bundled docs are present, and a DNS lookup from the isolated container FAILS). Runs the byte-identical
  # verifier a maintainer runs. amd64/native only — arm64 + the full model bundle stay release-time
  # (release.yml precedent). No needs: (the multi-stage Dockerfile self-compiles from source).
  # ---------------------------------------------------------------------------
  airgap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # cosign keyless self-test (same-repo only; see the guarded step below)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx (GHA layer cache for the multi-stage build)
        uses: docker/setup-buildx-action@v3

      # build-push-action wires the GHA cache token; load:true puts amd64 sentinel:local in the daemon.
      - name: Build sentinel:local (cached, amd64, loaded — not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sentinel:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Offline runtime verification (save/load -> --network none, no external calls)
        env:
          AIRGAP_SKIP_BUILD: "1"   # reuse the image built above instead of rebuilding
        run: scripts/offline-verify.sh --local

      # Cosign verify-blob MECHANISM self-test (M11.4 criterion 5, "mechanism verified"): sign a
      # throwaway blob keyless with THIS run's OIDC identity, then verify it OFFLINE via --bundle (no
      # Rekor call). Exercises the exact verify flag shape used against real release bundles — it would
      # have caught the cosign `--offline`-flag removal. The SIGN half needs network (Sigstore); this
      # tests the verify mechanism, not the air-gapped runtime. Skipped on FORK PRs (no id-token there).
      - name: Install cosign (mechanism self-test)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: sigstore/cosign-installer@v3
      - name: Cosign sign + OFFLINE verify-blob round-trip
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          echo "m11.4 airgap self-test ${GITHUB_SHA}" > /tmp/probe.txt
          cosign sign-blob --yes --bundle /tmp/probe.cosign.bundle /tmp/probe.txt
          cosign verify-blob /tmp/probe.txt --bundle /tmp/probe.cosign.bundle \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
