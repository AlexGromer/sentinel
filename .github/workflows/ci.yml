# Sentinel CI — M3 "CI-Ready Replay / Trust Layer" (see docs/M3_CONTRACT.md §GitHub Actions).
#
# Pipeline shape:
#   build   -> compiles all three components (Go agentctl, TS pw-executor, Python brain deps),
#              runs pw-executor's own node:test suite (QA-PWEXEC-CI) + `go vet` + `go test ./...` +
#              the Python offline suite (m3..m9_2b), and publishes a reusable build artifact.
#   security-> deterministic gates on push/PR: gitleaks (HARD, secrets) + pip-audit (advisory,
#              Python). The live-DB supply-chain scanners (govulncheck + npm audit) run nightly
#              in security-nightly.yml (#8) so a fresh upstream CVE can't redden an unrelated PR.
#   replay  -> matrix over the two fixtures; explores `testdata/site` to produce a plan,
#              freezes goldens from it, then replays against each matrix target with --ci
#              and ASSERTS the structured exit code (site -> 0, site-v2 -> 2 per the contract).
#   explore -> manual (workflow_dispatch) only; produces a downloadable plan.json artifact.
#
# The `security` job closes the docs-vs-reality gap (gitleaks was documented but absent from CI)
# and partially closes GAP-SEC-002 (supply-chain). The offline-suite + go test steps were run
# locally before this workflow was committed.
name: ci

on:
  push:
  pull_request:
  # Manual trigger drives the `explore` job (gated below on event_name).
  workflow_dispatch:

# Least-privilege default token: no job needs more than read — artifact up/download use the
# Actions runtime token, and gitleaks only reads. Override per-job if a step ever needs write.
permissions:
  contents: read

# One in-flight run per ref; newer pushes cancel stale CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # build: compile everything once, publish bin/ + pw-executor/dist/ as artifact.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go 1.26 (control-plane / agentctl)
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Set up Node 24 (pw-executor)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install uv (Python env/dep manager for the brain)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # QA-PWEXEC-CI: `pw-executor` ships determinism.test.ts + launch.test.ts (node:test) that no
      # workflow ever called — `npm test` and `npm run build` were two independent, uncalled-for full
      # `tsc` passes. Resolved by running `npm test` HERE, in place of `npm run build`: ONE tsc pass
      # compiles the package AND gates it (PW_CDP_ENDPOINT precedence in resolveLaunchPlan; the
      # screenshot-determinism constants) instead of a second pass buying nothing new. `postbuild` /
      # `posttest` (pw-executor/package.json) then strip dist/*.test.js so no consumer of
      # pw-executor/dist ships test code: this job's own later steps, the artifact uploaded below, and
      # the Docker image (`RUN npm run build` in the ts-build stage — same postbuild hook, untouched
      # Dockerfile).
      #
      # Floor is on the SOURCE test-file count, not on node:test's summary text (reporter format is
      # not a CI contract and already differs between a TTY and a pipe). Below the floor,
      # `dist/*.test.js` also fails to glob-expand and `node --test` errors on the literal string —
      # belt and suspenders, not either/or (see the discovery-floor pattern below at "offline suite").
      - name: Build + unit-test pw-executor (TypeScript -> dist/server.js; node:test gates the compile)
        run: |
          cd pw-executor
          # nullglob (not `ls | wc -l`): under the default `bash -eo pipefail`, `ls` on a
          # zero-match glob exits 1 and pipefail would abort the step right here, before the
          # `if` below ever runs its own error message — same hazard the offline-suite step
          # avoids the same way (see `shopt -s nullglob` there).
          shopt -s nullglob
          files=(src/*.test.ts)
          n=${#files[@]}
          if [ "$n" -lt 3 ]; then
            echo "::error::pw-executor: only $n src/*.test.ts found — expected at least 3 (determinism, launch, decorate)"
            exit 1
          fi
          echo "pw-executor: $n *.test.ts found (${files[*]})"
          npm ci
          # ⚠ THE BROWSER HAS TO BE HERE, BEFORE `npm test` (LIVE-HUMAN / ADR-120). This install used
          # to be a step of its own, further down — which was fine while every node:test in the
          # package was pure. `decorate.test.ts` is not: what it claims (a cursor is drawn into the
          # page, and is absent from the frame a model or a golden reads) is a claim about pixels,
          # and the only way to assert it that a mutation cannot walk through is to drive a real
          # page. Left below, the suite would fail in CI on a missing executable while passing
          # locally — the worst possible split. Browsers land in the machine-global cache
          # (~/.cache/ms-playwright), so every later step and job resolves them regardless of cwd.
          npx playwright install --with-deps chromium-headless-shell
          npm test

      # PERCEPT-RECORDER-SHADOW / M9.8: until this step, the MV3 extension was named by NO workflow.
      # It was not compiled, not tested, and `scripts/check_bilingual.py` excludes the directory
      # outright — so a change to the content-script recorder could not turn anything red. The one
      # CI-visible recorder check (tests/test_record_bridge_recorder_e2e.py) replays a transcript
      # frozen inside the test file: a fix and a regression pass it identically.
      #
      # `npm test` is `tsc --noEmit && node --import tsx --test src/**/*.test.ts` — one pass both
      # type-checks the extension and runs its jsdom unit tests. This step must stay AHEAD of the
      # Python offline suite: tests/test_recorder_shadow_offline.py loads the real recorder through
      # tsx and FAILS (never skips) when extension/node_modules is absent.
      #
      # Floor on the SOURCE test-file count, same shape and same reason as the pw-executor step
      # above: below it, the glob also fails to expand and `node --test` errors on the literal.
      - name: Build + unit-test the MV3 extension (tsc --noEmit; jsdom node:test — PERCEPT-RECORDER-SHADOW)
        run: |
          cd extension
          shopt -s nullglob globstar
          files=(src/**/*.test.ts)
          n=${#files[@]}
          if [ "$n" -lt 1 ]; then
            echo "::error::extension: no src/**/*.test.ts found — npm test would pass over nothing"
            exit 1
          fi
          echo "extension: $n *.test.ts found (${files[*]})"
          npm ci
          npm test

      # The Playwright browser install used to stand here. It moved UP into the pw-executor step
      # (ADR-120): that step's own suite now drives a real page, so the browser is a precondition of
      # `npm test` rather than of the steps after it. Not duplicated here — `--with-deps` runs apt on
      # every invocation, and a second copy would only make the job slower while hiding which step
      # actually needs it.

      - name: Build agentctl (Go)
        run: go build -o bin/agentctl ./cmd/agentctl

      # The wizard DOM gate below drives a REAL control-api backed by a REAL store-gateway, so CI must
      # build both (control-api previously only ever existed inside the Docker image).
      - name: Build control-api + store-gateway (Go)
        run: |
          go build -o bin/control-api ./cmd/control-api
          go build -o bin/store-gateway ./cmd/store-gateway

      - name: Vet + unit test (Go)
        run: |
          go vet ./...
          go test ./...

      # ⚠ THIS STEP EXISTS BECAUSE ITS ABSENCE COST A RELEASE. `syscall.Kill` reached
      # cmd/control-api on 2026-08-06; it does not exist on Windows, and the cross-build stayed broken
      # for ELEVEN DAYS. Nothing here could have caught it: every Go step above compiles for the HOST
      # only, the cross-build lived solely in release.yml, and that had not run since the previous tag.
      # `install-ps1-smoke` does run on windows-latest — but it exercises install.ps1 against a fake
      # release and never touches the Go toolchain. The first symptom was a failed release.
      #
      # The platform list is DERIVED from release.yml's matrix rather than repeated here. A hand-kept
      # copy is the failure this repository keeps measuring: it shows what is superfluous and never
      # what is absent, so a seventh platform added to the release would ship ungated while this step
      # stayed green. Compile only — `go test` for a foreign GOOS cannot run its binaries.
      - name: Cross-build every platform the release ships (compile only; list derived from release.yml)
        run: |
          set -euo pipefail
          mapfile -t PAIRS < <(grep -oE '\{ goos: [a-z0-9]+, goarch: [a-z0-9]+ \}' .github/workflows/release.yml \
            | sed -E 's/.*goos: ([a-z0-9]+), goarch: ([a-z0-9]+).*/\1\/\2/')
          if [ "${#PAIRS[@]}" -lt 4 ]; then
            echo "::error::derived only ${#PAIRS[@]} platform(s) from release.yml — the matrix moved and this gate is now vacuous"
            exit 1
          fi
          echo "platforms under the gate: ${PAIRS[*]}"
          for p in "${PAIRS[@]}"; do
            echo "--- GOOS=${p%/*} GOARCH=${p#*/}"
            CGO_ENABLED=0 GOOS="${p%/*}" GOARCH="${p#*/}" go build ./...
          done

      # Walks docs/ instead of an enumerated page list: the list had drifted to 3 of the 6 pages,
      # leaving docs/calculators/*.html (inline JS) ungated while the docs claimed full coverage.
      - name: SPA syntax check (inline JS of every docs page — node --check floor gate; M15 + M11.5 PR-4)
        run: |
          python3 - <<'PY'
          import re, pathlib
          pages = sorted(str(p) for p in pathlib.Path('docs').rglob('*.html'))
          assert pages, 'no docs/**/*.html found — the gate would pass vacuously'
          print('pages under the gate:', len(pages))
          for p in pages:
              html = pathlib.Path(p).read_text()
              blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S)
              out = '/tmp/spa_check__' + p.replace('/', '_') + '.js'
              pathlib.Path(out).write_text('\n;\n'.join(blocks))
              print(p, '-> inline <script> blocks:', len(blocks))
          PY
          for f in /tmp/spa_check__*.js; do echo "node --check $f"; node --check "$f"; done

      # Real headless-Chromium run of docs/setup/index.html against a real control-api. Closes the
      # "an interactive browser run is manual" boundary ADR-061 shipped with. Playwright + the browser
      # are already present from the pw-executor steps above; no new dependency.
      - name: Setup-wizard DOM gate (headless Chromium; M11.5)
        # ADR-097: a FLOOR on the count, like the Python suite has. Without it a deleted check
        # silently lowers the denominator and the step still reports success — a gate that
        # cannot fail is indistinguishable from a gate that passes. The number is a floor, not
        # the current count: raising it on every added check would make it a maintenance tax
        # rather than a tripwire.
        #
        # 2026-08-03: TWO corrections, both copied from the pages-static step below, which had them
        # from the start. (1) The floor now applies to the TOTAL, not to the number that PASSED —
        # `n` drops when a check fails, which is not the thing a deleted-check tripwire is for.
        # (2) `n -ne t` fails the step. Without it a check that failed on every single run still
        # left this step green: three of them had, since the identity checks landed, and the reason
        # turned out to be a guessed 800 ms sleep against a login that measures 1.0-1.6 s.
        run: |
          out=$(node scripts/wizard-dom-check.mjs 2>&1) || true; echo "$out"   # see the hub gate below for why `|| true`
          echo "$out" | grep -qE '^[0-9]+/[0-9]+ checks passed$' || {
            echo "::error::gate printed no pass line — it did not run to the end"; exit 1; }
          n=$(echo "$out" | grep -oE '^[0-9]+/[0-9]+ checks passed$' | cut -d/ -f1)
          t=$(echo "$out" | grep -oE '^[0-9]+/[0-9]+ checks passed$' | cut -d/ -f2 | cut -d' ' -f1)
          if [ "$n" -ne "$t" ]; then
            echo "::error::$n of $t checks passed in scripts/wizard-dom-check.mjs"; exit 1
          fi
          if [ "$t" -lt 15 ]; then
            echo "::error::only $t checks ran in scripts/wizard-dom-check.mjs — expected at least 15"; exit 1
          fi


      - name: Provision brain venv (frozen install from brain/uv.lock — #38)
        run: UV_PROJECT_ENVIRONMENT="$PWD/.venv" uv sync --frozen --project brain

      # ADR-065: the Logs view's claims are all about what a person SEES — the narrative staying out of
      # the diagnostics, a loop reading as one counted row, filters that filter, Russian with real
      # values, and <option> labels that switch language (they cannot be CSS-toggled). None of that is
      # reachable from Go or Python, so a real Chromium drives a real run against the real page.
      - name: Hub Logs-view DOM gate (headless Chromium; ADR-065)
        # ADR-097: a FLOOR on the count, like the Python suite has. Without it a deleted check
        # silently lowers the denominator and the step still reports success — a gate that
        # cannot fail is indistinguishable from a gate that passes. The number is a floor, not
        # the current count: raising it on every added check would make it a maintenance tax
        # rather than a tripwire.
        #
        # 2026-08-03: TWO corrections, both copied from the pages-static step below, which had them
        # from the start. (1) The floor now applies to the TOTAL, not to the number that PASSED —
        # `n` drops when a check fails, which is not the thing a deleted-check tripwire is for.
        # (2) `n -ne t` fails the step. Without it a check that failed on every single run still
        # left this step green: three of them had, since the identity checks landed, and the reason
        # turned out to be a guessed 800 ms sleep against a login that measures 1.0-1.6 s.
        run: |
          # `out=$(cmd)` under `bash -e` aborts the STEP when cmd fails, so the gate's own output
          # was discarded exactly when it was needed: a red run showed the step definition and
          # nothing else. `|| true` keeps the assignment from killing the step; the greps below
          # still decide pass/fail, so the gate is no weaker — only legible when it fails.
          out=$(node scripts/hub-dom-check.mjs 2>&1) || true; echo "$out"
          echo "$out" | grep -qE '^[0-9]+/[0-9]+ checks passed$' || {
            echo "::error::gate printed no pass line — it did not run to the end"; exit 1; }
          n=$(echo "$out" | grep -oE '^[0-9]+/[0-9]+ checks passed$' | cut -d/ -f1)
          t=$(echo "$out" | grep -oE '^[0-9]+/[0-9]+ checks passed$' | cut -d/ -f2 | cut -d' ' -f1)
          if [ "$n" -ne "$t" ]; then
            echo "::error::$n of $t checks passed in scripts/hub-dom-check.mjs"; exit 1
          fi
          if [ "$t" -lt 49 ]; then
            echo "::error::only $t checks ran in scripts/hub-dom-check.mjs — expected at least 49"; exit 1
          fi

      - name: Static-showcase DOM gate (the hub with NO control-API behind it; ADR-110)
        # The Pages deployment serves this same page with nothing behind it. The gate clicks through
        # every view with no backend and fails on anything that reaches the API anyway — it derives
        # the set rather than carrying a list, so a control added later is covered by where it lives.
        # Same floor rule as the gate above, and the same `|| true` so a failure prints its reason.
        run: |
          out=$(node scripts/pages-static-check.mjs 2>&1) || true; echo "$out"
          echo "$out" | grep -qE '^[0-9]+/[0-9]+ checks passed$' || {
            echo "::error::gate printed no pass line — it did not run to the end"; exit 1; }
          n=$(echo "$out" | grep -oE '^[0-9]+/[0-9]+ checks passed$' | cut -d/ -f1)
          t=$(echo "$out" | grep -oE '^[0-9]+/[0-9]+ checks passed$' | cut -d/ -f2 | cut -d' ' -f1)
          if [ "$n" -ne "$t" ]; then
            echo "::error::$n of $t checks passed in scripts/pages-static-check.mjs"; exit 1
          fi
          if [ "$t" -lt 5 ]; then
            echo "::error::only $t checks ran in scripts/pages-static-check.mjs — expected at least 5"; exit 1
          fi

      - name: Python offline suite (every tests/test_*_offline.py, discovered — FakeBackend/FakeExecutor, no network)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e
          # ADR-087: DISCOVERED, not listed. This was a hand-kept list of 31 names, so a gate added in
          # tests/ ran only if someone also remembered to add it here — and a gate that does not run is
          # indistinguishable from one that passes. Four suites were added this week alone; the list
          # survived only because each addition was noticed by hand.
          shopt -s nullglob
          found=0
          for f in tests/test_*_offline.py; do
            echo "== $(basename "$f" .py) =="
            .venv/bin/python "$f"
            found=$((found + 1))
          done
          # A glob that matches nothing must fail loudly rather than report success over an empty set —
          # the vacuous-pass failure mode this project keeps meeting in its own tests.
          if [ "$found" -lt 25 ]; then
            echo "::error::only $found offline suites discovered — the glob is not finding tests/"
            exit 1
          fi
          echo "-- $found offline suites --"
          # M9.8 recorder→bridge tie (offline, FakeExecutor) — doesn't match the *_offline.py glob.
          echo "== test_record_bridge_recorder_e2e =="
          .venv/bin/python tests/test_record_bridge_recorder_e2e.py

      # Ship only compiled outputs; node_modules / browsers / .venv are reinstalled
      # by downstream jobs (cheaper than dragging them through artifact storage).
      - name: End-to-end UI smoke against a real deployment (screenshots; ADR-110/111)
        # The three DOM gates above check PROPERTIES of the page. None of them answers the one
        # question a person asks — does the assembled, running product look like something usable.
        # This drives the stack the way an operator would (connect → start a run → verdict → the
        # three live modes → the accumulated views) and leaves PNGs behind.
        #
        # It runs HERE rather than in its own job because this job already has everything it needs:
        # the Go binaries, pw-executor/dist, the Playwright browser and the brain venv. A separate
        # job would reinstall all four to gain nothing.
        #
        # Waits are on STATE, never on a guessed interval — the lesson from the hub gate, whose
        # three identity checks failed on every run for weeks behind an 800 ms sleep.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e
          # A short socket path: a unix address is capped near 108 bytes and a longer one fails with
          # a bare "bind: invalid argument" that reads as a build problem.
          SOCK=/tmp/ui-smoke-store.sock
          ./bin/store-gateway --addr "$SOCK" --db /tmp/ui-smoke-store.db --no-auth &
          for i in $(seq 1 100); do [ -S "$SOCK" ] && break; sleep 0.1; done
          [ -S "$SOCK" ] || { echo "::error::store-gateway socket never appeared"; exit 1; }
          CONTROL_API_ADDR=127.0.0.1:8090 \
          CONTROL_API_TOKEN=ui-smoke-token \
          CONTROL_API_AGENTCTL="$PWD/bin/agentctl" \
          CONTROL_API_SERVE_UI=1 \
          CONTROL_API_UI_DIR="$PWD/docs" \
          CONTROL_API_CORS_ORIGINS= \
          CONTROL_API_STORE_ADDR="unix:$SOCK" \
            ./bin/control-api > /tmp/ui-smoke-api.log 2>&1 &
          for i in $(seq 1 200); do
            curl -sf http://127.0.0.1:8090/healthz >/dev/null && break; sleep 0.1
          done
          curl -sf http://127.0.0.1:8090/healthz >/dev/null || {
            echo "::error::control-api never answered /healthz"; sed -n '1,60p' /tmp/ui-smoke-api.log; exit 1; }
          node scripts/ui-smoke.mjs --base http://127.0.0.1:8090 --token ui-smoke-token \
            --out "$PWD/ui-smoke" || {
              echo "::error::the UI smoke failed — see the screenshots artifact"; sed -n '1,80p' /tmp/ui-smoke-api.log; exit 1; }

      - name: Press every control of the hub (Ф4 — the walk ui-smoke does not do)
        # ⚠ Отдельный шаг, а НЕ часть смоука, и стенд у них общий: смоук ОПИСЫВАЕТ и ФОТОГРАФИРУЕТ
        # каждый контрол, а нажимает четыре. «Протыкать каждую кнопку» не было покрыто ничем — и в
        # первый же день, когда протыкивание довели до конца, оно нашло дефект, мимо которого весь
        # этот конвейер проходил зелёным: копирующая кнопка объявляла «скопировано», не дождавшись
        # промиса и не имея обработчика отказа. Кадр показывал правильный ярлык, гейты молчали.
        # Стенд, поднятый предыдущим шагом, ещё жив — второй раз его поднимать незачем.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          node scripts/ui-press.mjs --base http://127.0.0.1:8090 --token ui-smoke-token \
            --out "$PWD/ui-press" || {
              echo "::error::протыкивание нашло контрол, который не нажат и не объявлен, либо нажатие сломало страницу"
              sed -n '1,60p' /tmp/ui-smoke-api.log; exit 1; }

      - name: Upload UI smoke screenshots
        # `always()`: a failing smoke is exactly when the pictures are worth having.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-screenshots
          path: ui-smoke/
          if-no-files-found: warn

      - name: Upload build artifact (bin/ + pw-executor/dist/)
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-build
          path: |
            bin/
            pw-executor/dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # replay: per-fixture deterministic replay with golden-diff, asserting exit code.
  # Plans live in git-ignored runs/, so we explore fresh here, freeze goldens, replay.
  # Per-job SQLite (M3_CONTRACT §GitHub Actions) — each matrix leg is isolated.
  # ---------------------------------------------------------------------------
  replay:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # run both legs even if one fails, for full signal
      matrix:
        target: [site, site-v2]   # site -> expect exit 0, site-v2 -> expect exit 2
    steps:
      - uses: actions/checkout@v7   # provides testdata/, brain/, lockfiles

      - name: Set up Node 24 (runtime for pw-executor)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install uv (brain runtime deps)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Restores bin/agentctl and pw-executor/dist/ at the repo root.
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: sentinel-build

      - name: Make agentctl executable
        run: chmod +x bin/agentctl

      # dist/ comes from the artifact; npm ci only restores the runtime node_modules
      # (the pw-executor imports `playwright` at runtime). No rebuild needed.
      - name: Restore pw-executor runtime deps
        run: cd pw-executor && npm ci

      - name: Install Playwright browser (chromium-headless-shell)
        run: cd pw-executor && npx playwright install --with-deps chromium-headless-shell

      - name: Provision brain venv (frozen install from brain/uv.lock — #38)
        run: UV_PROJECT_ENVIRONMENT="$PWD/.venv" uv sync --frozen --project brain

      # Explore -> baseline -> replay. The heuristic planner is deterministic and
      # needs no ANTHROPIC_API_KEY; replay runs without --heal-llm for the same reason.
      - name: Explore + freeze goldens + replay (assert exit code)
        env:
          AUT_SHA: ${{ github.sha }}   # AUT-SHA-gated flake quarantine input
        run: |
          set -e   # any precondition (explore / baseline) failing aborts the job

          # 1) Explore the ORIGINAL site to produce a frozen plan at a known path.
          ./bin/agentctl run \
            --target "file://$PWD/testdata/site/index.html" \
            --artifact-dir "runs/ci" \
            --planner heuristic

          PLAN="runs/ci/plan.json"
          test -s "$PLAN"   # plan must exist and be non-empty

          # 2) Freeze dual goldens (a11y-hash + screenshot-hash) from the original site.
          #    This is the ONLY golden mutation path; the replay below never writes goldens.
          ./bin/agentctl baseline update \
            --plan "$PLAN" \
            --target "file://$PWD/testdata/site/index.html"

          # 3) Replay against this matrix leg's target with --ci (forbids --force-replay).
          #    Capture the exit code WITHOUT aborting under set -e.
          set +e
          ./bin/agentctl run --replay \
            --plan "$PLAN" \
            --target "file://$PWD/testdata/${{ matrix.target }}/index.html" \
            --aut-version "$AUT_SHA" \
            --ci
          code=$?
          set -e

          # 4) Assert the structured exit code per docs/M3_CONTRACT.md.
          case "${{ matrix.target }}" in
            site)    expected=0 ;;   # unchanged DOM: no heal, no golden regression
            site-v2) expected=2 ;;   # drifted DOM: heals + golden-diff regression
            *)       echo "::error::unknown matrix target ${{ matrix.target }}"; exit 1 ;;
          esac

          if [ "$code" -ne "$expected" ]; then
            echo "::error::replay against '${{ matrix.target }}' exited $code, expected $expected"
            exit 1
          fi
          echo "OK: replay against '${{ matrix.target }}' exited $code (expected $expected)"

      # Heal/golden-diff report is useful for debugging a failed assertion.
      - name: Upload replay report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: heal-report-${{ matrix.target }}
          path: runs/ci/heal-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # explore: MANUAL only (workflow_dispatch). Produces a fresh plan.json for download
  # (e.g. to seed a baseline update locally). Not part of push/PR gating.
  # ---------------------------------------------------------------------------
  explore:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24 (runtime for pw-executor)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install uv (brain runtime deps)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: sentinel-build

      - name: Make agentctl executable
        run: chmod +x bin/agentctl

      - name: Restore pw-executor runtime deps
        run: cd pw-executor && npm ci

      - name: Install Playwright browser (chromium-headless-shell)
        run: cd pw-executor && npx playwright install --with-deps chromium-headless-shell

      - name: Provision brain venv (frozen install from brain/uv.lock — #38)
        run: UV_PROJECT_ENVIRONMENT="$PWD/.venv" uv sync --frozen --project brain

      - name: Explore testdata/site -> plan.json
        run: |
          set -e
          ./bin/agentctl run \
            --target "file://$PWD/testdata/site/index.html" \
            --artifact-dir "runs/explore" \
            --planner heuristic
          test -s runs/explore/plan.json

      - name: Upload plan.json artifact
        uses: actions/upload-artifact@v7
        with:
          name: plan
          path: runs/explore/plan.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # security: DETERMINISTIC gates only — gitleaks (HARD, secrets scan over full history)
  # + pip-audit (advisory, over the committed brain/uv.lock) + a CycloneDX SBOM artifact (#38). The
  # live-advisory-DB scanners (govulncheck + npm audit) moved to security-nightly.yml (#8) so PR/push
  # greenness never hinges on a freshly published upstream CVE. Runs in parallel with build.
  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans the full history, not just the tip

      - name: gitleaks (secrets scan — HARD fail)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: pip-audit (Python deps — advisory; audits the committed lock)
        continue-on-error: true   # advisory: a newly published CVE against the pinned lock must not redden an unrelated PR (#8)
        run: |
          uv export --frozen --no-dev --no-emit-project --project brain --format requirements-txt > requirements.lock
          uvx pip-audit -r requirements.lock

      - name: Upload Python dependency freeze (advisory artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-requirements-lock
          path: requirements.lock
          if-no-files-found: warn

      - name: SBOM (CycloneDX, from the frozen lock — #38)
        run: |
          uv export --frozen --no-dev --no-emit-project --project brain --format requirements-txt > sbom-requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements sbom-requirements.txt -o sbom.cdx.json

      - name: Upload SBOM (CycloneDX)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # bilingual: docs parity gate — every primary *.md must have a *.en.md pair,
  # and every *.en.md must have a primary sibling (no orphans). Runs in parallel
  # with build and security (no needs:). Pure Python stdlib; no venv required.
  # ---------------------------------------------------------------------------
  bilingual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check bilingual docs parity
        run: python3 scripts/check_bilingual.py

  # ---------------------------------------------------------------------------
  # airgap: M11.4 — the FIRST job to exercise the Dockerfile in CI. Builds sentinel:local, round-trips
  # it through `docker save`/`docker load`, and proves the RUNTIME makes zero external calls via
  # scripts/offline-verify.sh --local (agentctl under --network none, the LLM-free demo explores, the
  # bundled docs are present, and a DNS lookup from the isolated container FAILS). Runs the byte-identical
  # verifier a maintainer runs. amd64/native only — arm64 + the full model bundle stay release-time
  # (release.yml precedent). No needs: (the multi-stage Dockerfile self-compiles from source).
  # ---------------------------------------------------------------------------
  airgap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # cosign keyless self-test (same-repo only; see the guarded step below)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx (GHA layer cache for the multi-stage build)
        uses: docker/setup-buildx-action@v4

      # build-push-action wires the GHA cache token; load:true puts amd64 sentinel:local in the daemon.
      - name: Build sentinel:local (cached, amd64, loaded — not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          # ⚠ NAMED, not left to the default. A build that names no target gets the Dockerfile's LAST
          # stage, and until LIVE-VNC `runtime` happened to be it — so all three build sites in this
          # repository relied on stage ORDER without saying so. Adding any stage after `runtime` would
          # have silently re-pointed every one of them at the new image, and nothing would have been
          # red: the tags, the steps and the assertions below would all still be about `sentinel:local`.
          # tests/test_build_targets_offline.py derives the stages from the Dockerfile and the build
          # sites from this file, release.yml and scripts/offline-verify.sh, and fails any site that
          # does not name one.
          target: runtime
          load: true
          tags: sentinel:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=citest-${{ github.sha }}

      # ADR-110: the image must be able to say WHICH version it is. Until the Dockerfile took a
      # VERSION arg, the release matrix stamped the tarballs and the image was not stamped at all —
      # so the published `:latest` answered "dev" to --version, and control-api's /healthz answered a
      # hardcoded default, in the deployment we recommend over every other. Asserted on the built
      # image rather than by reading the Dockerfile: a source-shape check would agree with an
      # ldflags string that never reaches the linker.
      - name: The image ships the browsers it declares, and no others (ADR-036/ADR-124)
        # DIST-VARIANTS. The base used to be `mcr.microsoft.com/playwright`, which ships all three
        # engines — 583 MB of firefox+webkit that ADR-036 says are never launched, plus their system
        # deps. ADR-124 installs the engines BY NAME instead of inheriting somebody's set.
        #
        # The check is not a size threshold: a number would have to be maintained by hand and would
        # drift the moment a browser revision grows. It DERIVES the actual contents of the browser
        # directory and compares them with the declared set, so an engine that reappears — by a base
        # swap, by `--with-deps` gaining a default, by anyone — is red, and a declared one that
        # vanishes is red too.
        run: |
          set -euo pipefail
          got="$(docker run --rm --entrypoint sh sentinel:local -c 'ls -1 /ms-playwright' | sed 's/-[0-9]*$//' | sort -u | tr '\n' ' ')"
          want="chromium chromium_headless_shell ffmpeg "
          echo "browsers in the image: $got"
          [ "$got" = "$want" ] || {
            echo "::error::image ships '$got', declared '$want' — ADR-036 is Chromium-only; add the engine to the declaration WITH a reason, or stop installing it"
            exit 1; }

      - name: The image knows its own version
        run: |
          set -euo pipefail
          want="citest-${GITHUB_SHA}"
          got="$(docker run --rm --entrypoint /app/bin/agentctl sentinel:local --version)"
          [ "$got" = "$want" ] || { echo "::error::image agentctl --version is '$got', expected '$want'"; exit 1; }
          # control-api reports the same string over /healthz — that is where a running deployment is
          # actually asked, and it has its own `var version` that could drift from agentctl's.
          cid="$(docker run -d -e CONTROL_API_ADDR=0.0.0.0:8090 -p 18790:8090 --entrypoint /app/bin/control-api sentinel:local)"
          for _ in $(seq 1 40); do
            curl -fsS -o /tmp/hz.json "http://127.0.0.1:18790/healthz" && break || sleep 0.5
          done
          docker rm -f "$cid" >/dev/null
          hv="$(python3 -c "import json;print(json.load(open('/tmp/hz.json')).get('version',''))")"
          [ "$hv" = "$want" ] || { echo "::error::/healthz reports version '$hv', expected '$want'"; exit 1; }
          echo "image version gate: OK ($want, from both agentctl and /healthz)"

      - name: Offline runtime verification (save/load -> --network none, no external calls)
        env:
          AIRGAP_SKIP_BUILD: "1"   # reuse the image built above instead of rebuilding
        run: scripts/offline-verify.sh --local

      # Cosign verify-blob MECHANISM self-test (M11.4 criterion 5, "mechanism verified"): sign a
      # throwaway blob keyless with THIS run's OIDC identity, then verify it OFFLINE via --bundle (no
      # Rekor call). Exercises the exact verify flag shape used against real release bundles — it would
      # have caught the cosign `--offline`-flag removal. The SIGN half needs network (Sigstore); this
      # tests the verify mechanism, not the air-gapped runtime. Skipped on FORK PRs (no id-token there).
      - name: Install cosign (mechanism self-test)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: sigstore/cosign-installer@v4.1.2   # v3 CANNOT install cosign v3.x (installs a stale v2.x) — v4 required
      - name: Cosign sign + OFFLINE verify-blob round-trip
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          echo "m11.4 airgap self-test ${GITHUB_SHA}" > /tmp/probe.txt
          cosign sign-blob --yes --bundle /tmp/probe.cosign.bundle /tmp/probe.txt
          cosign verify-blob /tmp/probe.txt --bundle /tmp/probe.cosign.bundle \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  # ---------------------------------------------------------------------------
  # install-smoke: M11.5 — exercises install.sh end-to-end against a LOCALLY-built fake release
  # (build agentctl -> package tar + checksums -> serve over http -> run install.sh -> assert the
  # binary + --version; then a tampered checksum must fail non-zero). No real Release needed — the
  # real signed-release install E2E is maintainer-gated on the first v* tag (like M11.1). cosign is
  # not installed here, so install.sh takes its documented warn-and-continue path (cosign verify is
  # tag-time). No needs: (independent of the build artifact).
  # ---------------------------------------------------------------------------
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go 1.26 (build the fake-release agentctl)
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: shellcheck all shell scripts
        # DERIVED, not listed (docs/DEVELOPMENT.md §0, principle 5). This step used to name six files
        # on one line, so a script added under scripts/ was linted only if somebody also remembered to
        # extend that line — and a linter that never runs is indistinguishable from one that passes.
        # The step's own name has said "all shell scripts" the whole time.
        run: |
          set -euo pipefail
          mapfile -t sh < <(git ls-files '*.sh')
          # A floor, for the same reason every derived list in this repository carries one: a walk
          # that stops finding files lints nothing and reports success in exactly the same words.
          [ "${#sh[@]}" -ge 6 ] || { echo "::error::only ${#sh[@]} shell script(s) found by the walk — the walk, not the tree, is what broke"; exit 1; }
          printf '  %s\n' "${sh[@]}"
          shellcheck "${sh[@]}"
      - name: install.sh e2e vs a local fake release (+ tampered-checksum negative)
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"; tag=v0.0.0-citest; out="sentinel-$tag-linux-amd64"
          mkdir -p "$stage/$tag/$out"
          go build -ldflags "-X main.version=$tag" -o "$stage/$tag/$out/agentctl" ./cmd/agentctl
          cp LICENSE "$stage/$tag/$out/" 2>/dev/null || true
          tar -C "$stage/$tag" -czf "$stage/$tag/$out.tar.gz" "$out"
          ( cd "$stage/$tag" && rm -rf "$out" && sha256sum "$out.tar.gz" > checksums.sha256 )
          ( cd "$stage" && python3 -m http.server 8099 >/dev/null 2>&1 & echo $! > "$stage/srv.pid" )
          # Same race as the Windows peer below, same reason for polling rather than sleeping: a refused
          # connection here is reported by install.sh as a download failure, so the symptom points at the
          # installer instead of at a server that had not bound yet.
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null "http://localhost:8099/" && break
            sleep 0.5
          done
          curl -fsS -o /dev/null "http://localhost:8099/" || {
            kill "$(cat "$stage/srv.pid")" 2>/dev/null || true
            echo "::error::the local release server never answered on :8099 within 30s — this is the harness, not install.sh"
            exit 1
          }
          # positive: download -> checksum -> install -> --version
          SENTINEL_VERSION="$tag" SENTINEL_BASE_URL="http://localhost:8099" SENTINEL_BIN_DIR="$stage/bin" sh install.sh
          test -x "$stage/bin/agentctl"
          [ "$("$stage/bin/agentctl" --version)" = "$tag" ] || { echo "::error::agentctl --version mismatch"; exit 1; }
          # negative: a tampered checksum MUST make install.sh exit non-zero (acceptance criterion)
          printf '%064d  %s\n' 0 "$out.tar.gz" > "$stage/$tag/checksums.sha256"
          if SENTINEL_VERSION="$tag" SENTINEL_BASE_URL="http://localhost:8099" SENTINEL_BIN_DIR="$stage/bin2" sh install.sh >/dev/null 2>&1; then
            kill "$(cat "$stage/srv.pid")" 2>/dev/null || true
            echo "::error::install.sh accepted a tampered checksum"; exit 1
          fi
          kill "$(cat "$stage/srv.pid")" 2>/dev/null || true
          echo "install-smoke: OK (positive install + tampered-checksum rejection)"

  # ---------------------------------------------------------------------------
  # deb-smoke: ADR-110 — the .deb is BUILT, INSTALLED and REMOVED on a real apt host.
  #
  # `dpkg-deb --build` succeeding proves almost nothing: it will happily produce an archive whose
  # binaries land somewhere nothing looks, whose maintainer scripts abort mid-configure, or whose
  # service starts on install. So this installs the package and asserts what an operator would
  # notice, including the two properties that are decisions rather than accidents:
  #   * the systemd unit is present and NOT enabled — installing a package is not consent to open a
  #     token-minting HTTP service (see packaging/deb/sentinel-control-api.service);
  #   * the conffile is registered as one, so an operator's edits survive an upgrade instead of
  #     being silently overwritten.
  # Removal is asserted too: a package that cannot be cleanly removed is a package people refuse to
  # install in the first place.
  # ---------------------------------------------------------------------------
  deb-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Build the four control-plane binaries
        run: |
          set -euo pipefail
          mkdir -p debbin
          for c in agentctl control-api store-gateway orchestrator; do
            CGO_ENABLED=0 go build -ldflags "-X main.version=v0.0.0-citest" -o "debbin/$c" "./cmd/$c"
          done
      - name: Build, install, inspect and remove the package
        run: |
          set -euo pipefail
          deb="$(sh scripts/build-deb.sh 0.0.0-citest amd64 debbin dist)"
          echo "built: $deb"
          sudo apt-get install -y "./$deb"

          # The binaries are where the package says they are, and they run.
          for c in agentctl control-api store-gateway orchestrator; do
            test -x "/usr/bin/$c" || { echo "::error::/usr/bin/$c missing from the installed package"; exit 1; }
          done
          got="$(agentctl --version)"
          [ "$got" = "v0.0.0-citest" ] || { echo "::error::agentctl --version = '$got'"; exit 1; }

          # The unit exists and is NOT enabled. `is-enabled` prints `disabled` and exits non-zero for
          # a unit with an [Install] section that was never enabled — so the STRING is the assertion,
          # not the exit code, and `set -e` must not eat it.
          test -f /usr/lib/systemd/system/sentinel-control-api.service \
            || { echo "::error::the systemd unit is not in the package"; exit 1; }
          state="$(systemctl is-enabled sentinel-control-api 2>/dev/null || true)"
          [ "$state" = "disabled" ] || { echo "::error::unit state is '$state', expected 'disabled' — a package install must not arm the service"; exit 1; }
          # `if`, not `cmd && { exit 1; }`: under `set -e` the AND-list fails in the GOOD case (the
          # service is not active), which would abort the job exactly when the assertion holds.
          if systemctl is-active --quiet sentinel-control-api; then
            echo "::error::the service is RUNNING after a plain install"; exit 1
          fi

          # The env file is registered as a conffile, or an upgrade silently discards operator edits.
          test -f /etc/sentinel/control-api.env || { echo "::error::conffile not installed"; exit 1; }
          dpkg-query -W -f='${Conffiles}\n' sentinel | grep -q '/etc/sentinel/control-api.env' \
            || { echo "::error::/etc/sentinel/control-api.env is NOT registered as a conffile"; exit 1; }
          grep -q '^CONTROL_API_AGENTCTL=/usr/bin/agentctl' /etc/sentinel/control-api.env \
            || { echo "::error::the packaged env file does not point control-api at the packaged agentctl"; exit 1; }

          # dpkg's own integrity view must be clean — this is what md5sums buys.
          sudo dpkg -V sentinel || { echo "::error::dpkg -V reports the installed files do not match the package"; exit 1; }

          sudo apt-get purge -y sentinel
          if [ -e /usr/bin/agentctl ]; then
            echo "::error::purge left /usr/bin/agentctl behind"; exit 1
          fi
          echo "deb-smoke: OK (build, install, layout, disabled unit, conffile, purge)"

  # ---------------------------------------------------------------------------
  # collect-live-run-smoke: M9-LIVE prep — proves scripts/collect-live-run.sh redacts BY DEFAULT.
  # A synthetic run dir is planted with ONE DISTINCT canary per redaction mechanism: structural
  # value/text blanking (fill · type · aliased verb setValue) · keyword k=v prose · Authorization
  # header (Bearer + Basic) · cookie header · each credential SHAPE the script advertises (sk- · ghp_ ·
  # AKIA · xox · JWT) · and — critically — shaped secrets stored UNDER a SAFE_KEY-named field, which an
  # earlier version routed around the sweep. Three canaries can only be handled by EXCLUSION
  # (storage_state.json, trace.zip, checkpoint.db). Because every canary is distinct, breaking any one
  # mechanism leaves ITS canary behind rather than hiding behind a sibling rule (mutation-tested).
  # THE acceptance criterion decompresses the bundle to disk (so a corrupt archive is a HARD error, not
  # a silently-passing empty grep) and asserts NO canary of any mechanism survives. Grepping the .tar.gz
  # blob would pass vacuously — gzip hides the plaintext, which is also why gitleaks is not a safety net.
  # ---------------------------------------------------------------------------
  collect-live-run-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: collect-live-run.sh — default redaction + exclusions + --with-trace opt-in
        run: |
          set -euo pipefail
          id=citestcanary
          mkdir -p "runs/$id"
          # structural value/text blanking — no keyword, no shape, so ONLY the typing-step blank removes
          # these. `setValue` is an ALIAS verb: it must still be blanked (not a closed verb allowlist).
          printf '{"plan_hash":"deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef","model":"claude-opus-4-8","steps":[{"step_id":1,"action_type":"fill","value":"CANARY-STRUCTFILL-01234567"},{"step_id":2,"action_type":"setValue","selector":"#pass","value":"CANARY-ALIAS-01234567"}]}\n' > "runs/$id/plan.json"
          printf '{"steps":[{"action_type":"type","text":"CANARY-STRUCTTYPE-01234567"}]}\n' > "runs/$id/scenario.json"
          # A1: shaped secrets stored UNDER SAFE_KEY-named fields (hash, outcome) — the shape sweep must
          # still fire on analysis-field values, or these route straight out unmasked.
          printf '{"hash":"ghp_CANARYSAFEKEY0123456789","outcome":"sk-CANARY-SAFEKEY-0123456789"}\n' > "runs/$id/reconcile-report.json"  # gitleaks:allow (fake shaped canaries)
          # keyword prose + auth headers (Basic is caught ONLY by the header rule) + A2: a U+2028 (raw
          # bytes E2 80 A8) INSIDE a JSON string — valid JSON, but str.splitlines() would tear the record
          # and skip the structural blank of `value`, leaking CANARY-U2028.
          printf '{"step":1,"action_type":"fill","note":"page\xe2\x80\xa8break","value":"CANARY-U2028-01234567","decision":"fill password CANARY-KV-0123456789","reason":"Authorization: Bearer CANARY-HDR-0123456789","note2":"Authorization: Basic CANARY-BASIC-0123456789","prompt_tokens":11}\n' > "runs/$id/llm-transcript.jsonl"
          # every advertised credential SHAPE + cookie, swept as plain text in the HTML report
          printf '<html><body><p>sk-CANARY-SK-0123456789</p><p>ghp_CANARYGHP0123456789</p><p>AKIACANARY0123456789</p><p>xoxb-CANARY-0123456789</p><p>eyJCANARYAAAAAA.eyJCANARYBBBBBB.CANARYCCCC</p><p>Cookie: sid=CANARY-COOKIE-0123456789</p></body></html>\n' > "runs/$id/report.html"  # gitleaks:allow (fake shaped canaries)
          printf 'sentinel_run_steps 2\n' > "runs/$id/metrics.prom"
          # these three can never be redacted — only excluded
          printf '{"cookies":[{"name":"sid","value":"CANARY-EXCLUDED-state-0123456789"}]}\n' > "runs/$id/storage_state.json"
          printf 'PK-fake-zip CANARY-EXCLUDED-trace-0123456789\n' > "runs/$id/trace.zip"
          printf 'msgpack-blob CANARY-EXCLUDED-ckpt-0123456789\n' > "runs/$id/checkpoint.db"

          scripts/collect-live-run.sh "$id"                                   # (a) exits 0
          bundle="live-results/live-$id.tar.gz"
          test -f "$bundle"                                                   # (b) bundle written
          # (c) the three files that must never ship by default
          for forbidden in 'trace\.zip' 'storage_state' 'checkpoint'; do
            if tar tzf "$bundle" | grep -q "$forbidden"; then
              echo "::error::$forbidden is in the default bundle"; exit 1
            fi
          done
          # (d) ACCEPTANCE CRITERION — decompress to disk first (a bad archive now HARD-fails via set -e
          # instead of masquerading as an empty grep), then assert no canary of ANY mechanism survives.
          work="$(mktemp -d)"
          tar xzf "$bundle" -C "$work"
          if grep -rhoE 'CANARY[A-Z0-9-]*' "$work" | sort -u | grep .; then
            echo "::error::the canaries listed above survived redaction"; exit 1
          fi
          # (e) analysis-critical fields are NOT collateral damage (real values that would break analysis
          # if scrubbed: a 64-hex plan_hash, a legit model name under a SAFE_KEY field, an int counter)
          grep -rq 'deadbeefdeadbeef' "$work" || { echo "::error::plan_hash was scrubbed"; exit 1; }
          grep -rq 'claude-opus-4-8'  "$work" || { echo "::error::a legit model name was over-masked"; exit 1; }
          grep -rq '"prompt_tokens": 11' "$work" || { echo "::error::token counters were mangled"; exit 1; }
          # (f) the opt-in path still works (and ships the trace unredacted, by design)
          scripts/collect-live-run.sh "$id" --with-trace
          tar tzf "$bundle" | grep -q 'trace\.zip' || { echo "::error::--with-trace did not include trace.zip"; exit 1; }
          # (g) guards: traversal-shaped id and an unknown run must both be refused
          if scripts/collect-live-run.sh '../etc' >/dev/null 2>&1; then echo "::error::traversal id accepted"; exit 1; fi
          if scripts/collect-live-run.sh 'nosuchrun' >/dev/null 2>&1; then echo "::error::missing run accepted"; exit 1; fi
          echo "collect-live-run-smoke: OK (no canary survived; trace/storage_state/checkpoint excluded; opt-in honoured)"

  # ---------------------------------------------------------------------------
  # install-ps1-smoke: M11-DIST — the Windows peer of install-smoke. Cross-builds agentctl.exe,
  # packages a fake windows release, serves it, runs install.ps1 (positive) + a tampered-checksum
  # negative (must exit non-zero). windows-latest has go/python/tar.exe/pwsh. cosign absent ->
  # install.ps1 takes its warn-and-continue path. Real signed-release E2E = maintainer v* tag.
  # ---------------------------------------------------------------------------
  install-ps1-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: install.ps1 e2e vs a local fake release (+ tampered-checksum negative)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.0.0-citest'; $out = "sentinel-$tag-windows-amd64"
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "$tag/$out") | Out-Null
          $env:GOOS='windows'; $env:GOARCH='amd64'
          go build -ldflags "-X main.version=$tag" -o (Join-Path $stage "$tag/$out/agentctl.exe") ./cmd/agentctl
          Copy-Item LICENSE (Join-Path $stage "$tag/$out/") -ErrorAction SilentlyContinue
          Remove-Item Env:\GOOS, Env:\GOARCH
          tar.exe -C (Join-Path $stage $tag) -czf (Join-Path $stage "$tag/$out.tar.gz") $out
          Push-Location (Join-Path $stage $tag)
          Remove-Item -Recurse -Force $out
          $hash = (Get-FileHash -Algorithm SHA256 "$out.tar.gz").Hash.ToLower()
          "$hash  $out.tar.gz" | Out-File -Encoding ascii -NoNewline checksums.sha256
          Pop-Location
          $srv = Start-Process python -ArgumentList '-m','http.server','8099' -WorkingDirectory $stage -PassThru
          # A fixed sleep is a bet that the runner finishes binding a socket inside two seconds, and it
          # loses often enough to have reddened PRs that touch nothing near the installer. The loss also
          # LIES about where the fault is: install.ps1 reports "target machine actively refused it
          # (localhost:8099)", which reads as a broken installer rather than a server that had not
          # finished starting. Poll for the port instead, and say so plainly when it truly never comes up.
          $ready = $false
          foreach ($i in 1..60) {
            try {
              if ((Invoke-WebRequest -Uri 'http://localhost:8099/' -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) {
                $ready = $true; break
              }
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
            throw "the local release server never answered on :8099 within 30s — this is the harness, not install.ps1"
          }
          try {
            $env:SENTINEL_VERSION = $tag
            $env:SENTINEL_BASE_URL = 'http://localhost:8099'
            $env:SENTINEL_BIN_DIR = Join-Path $env:RUNNER_TEMP 'bin'
            # positive
            $p = Start-Process pwsh -ArgumentList '-NoProfile','-File','./install.ps1' -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "install.ps1 (positive) exited $($p.ExitCode)" }
            $bin = Join-Path $env:SENTINEL_BIN_DIR 'agentctl.exe'
            if (-not (Test-Path $bin)) { throw "agentctl.exe not installed" }
            $v = & $bin --version
            if ($v -ne $tag) { throw "agentctl --version mismatch: '$v' != '$tag'" }
            # negative: tampered checksum MUST make install.ps1 exit non-zero
            ('0' * 64 + "  $out.tar.gz") | Out-File -Encoding ascii -NoNewline (Join-Path $stage "$tag/checksums.sha256")
            $env:SENTINEL_BIN_DIR = Join-Path $env:RUNNER_TEMP 'bin2'
            $n = Start-Process pwsh -ArgumentList '-NoProfile','-File','./install.ps1' -Wait -PassThru -NoNewWindow
            if ($n.ExitCode -eq 0) { throw "install.ps1 accepted a tampered checksum" }
            Write-Host "install-ps1-smoke: OK (positive install + tampered-checksum rejection)"
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }

  # ---------------------------------------------------------------------------
  # lint: ADVISORY (M11-DIST PR-B, from the 2026-07-06 CI audit) — golangci-lint (Go) + ruff (Python
  # brain/tests). NON-BLOCKING by design: these run on an existing codebase and surface findings as
  # annotations without reddening the PR (job `continue-on-error` + golangci `--issues-exit-code=0` +
  # ruff `|| true`). Making them blocking is a follow-up after a cleanup pass. If a golangci-lint
  # release lags the repo's Go toolchain, this job is advisory-only — that's acceptable here.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # golangci-lint's latest release (v1.64.x) is still built with an older Go and REFUSES to lint a
      # go1.26 target ("Go version go1.24 ... lower than 1.26", exit 3). Wired here for when golangci
      # ships a go1.26 build; step-level continue-on-error keeps the job GREEN and lets ruff still run.
      - name: golangci-lint (advisory)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --issues-exit-code=0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: ruff (advisory — brain + tests)
        run: uvx ruff check brain/ tests/ || true
