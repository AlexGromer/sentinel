// Sentinel StoreService (M13, ADR-049/050) — the store-gateway's 5-domain persistence contract,
// layered on top of the legacy heal/trust PersistenceService (persistence.proto) in the SAME package
// + go_package so both services live in one `pb` package and one single-writer DB (ADR-007).
// SQLite-first (portable `ON CONFLICT` SQL); a Postgres backend slots in later behind STORE_DSN
// (M13-service, M11/ADR-053). Stubs are generated for Go + Python; drift = build failure.
syntax = "proto3";

package sentinel.persistence.v1;

option go_package = "github.com/AlexGromer/sentinel/internal/store/pb;pb";

import "persistence.proto"; // reuse Empty

// --- runs (persist control-API's in-memory run map; survives restart) --------
message RunRecord {
  string run_id = 1;
  string conversation_id = 2; // M13: the runs<->chats join (today only in argv, lost on restart)
  string mode = 3;            // explore | goal | describe | replay | baseline | chat
  string target = 4;
  string planner = 5;
  string state = 6;           // running | done | failed
  int64 exit_code = 7;
  string artifact_dir = 8;
  string error = 9;
  string started_at = 10;     // RFC3339
  string finished_at = 11;    // RFC3339 ("" while running)
  bool found = 12;            // false => no such run (GetRun)
  // ADR-109: the local account that owns this row. EMPTY means unowned, which is what every row
  // written before identity existed carries — and what a single-team install keeps carrying, because
  // identity is OPT-IN: with no users created, nothing is scoped and the deployment behaves exactly
  // as it did. Scoping a store that has no subjects would break the one-team install that open-core
  // exists to serve.
  string owner = 13;
}
message RunId { string run_id = 1; }
message ListRunsReq {
  int64 limit = 1;   // 0 => a sane default cap
  int64 offset = 2;
  string state = 3;  // "" => any
  string owner = 4;  // ADR-109: "" => every row (a machine token); otherwise only this account's
}
message RunList { repeated RunRecord runs = 1; int64 total = 2; }

// --- scenarios / tests (index plan.json/scenario.json; promote -> test) ------
message Scenario {
  string scenario_id = 1;
  string name = 2;
  string target = 3;
  string run_mode = 4;    // goal | describe
  string plan_hash = 5;   // brain/state.py:canonical_plan_hash
  string steps_json = 6;  // opaque grounded-steps JSON
  int64 unmatched = 7;
  string tags = 8;        // comma-separated
  string source_run_id = 9;
  string created_at = 10;
  bool found = 11;
  string owner = 12;   // ADR-109
}
message ScenarioId { string scenario_id = 1; }
message ListScenariosReq { int64 limit = 1; int64 offset = 2; string target = 3; string owner = 4; }
message ScenarioList { repeated Scenario scenarios = 1; int64 total = 2; }
message PromoteReq {
  string scenario_id = 1;
  string name = 2;
  string schedule = 3; // reserved: stored, NOT executed (no scheduler in M13)
  string owner = 4;    // ADR-109: the promoted test inherits the promoter, not the scenario
}
message TestRecord {
  string test_id = 1;
  string scenario_id = 2;
  string plan_hash = 3;
  string name = 4;
  string schedule = 5;    // reserved column only
  bool enabled = 6;
  string last_status = 7; // pass | fail | ""
  string last_run_id = 8;
  string created_at = 9;
  bool found = 10;
  string owner = 11;   // ADR-109
}
message TestId { string test_id = 1; }
message ListTestsReq { int64 limit = 1; int64 offset = 2; string owner = 3; }
message TestList { repeated TestRecord tests = 1; int64 total = 2; }

// --- chats (BROWSABLE PROJECTION of state/conversations.db, NOT a duplicate) -
message ChatProjection {
  string conversation_id = 1;
  string last_target = 2;
  int64 turn_count = 3;
  string last_active = 4; // RFC3339
  string last_goal = 5;
  string summary = 6;     // rolling summary (GAP-M9-20)
  bool found = 7;
  string owner = 8;       // ADR-109
}
message ConversationId { string conversation_id = 1; }
message ListChatsReq { int64 limit = 1; int64 offset = 2; string owner = 3; }
message ChatList { repeated ChatProjection chats = 1; int64 total = 2; }

// --- results (index heal-report.json / report.json) --------------------------
message ResultRecord {
  string run_id = 1;
  string plan_id = 2;
  string mode = 3;
  string verdict = 4;         // pass | problem | regression | integrity
  int64 exit_code = 5;
  int64 healed = 6;
  int64 failed = 7;
  string regressions_json = 8;
  string steps_json = 9;
  double coverage = 10;
  int64 duration_ms = 11;
  string created_at = 12;
  bool found = 13;
  string owner = 14;          // ADR-109
}
message ListResultsReq { int64 limit = 1; int64 offset = 2; string owner = 3; }
message ResultList { repeated ResultRecord results = 1; int64 total = 2; }

// --- users (ADR-109: LOCAL accounts; OIDC/SSO/RBAC stay commercial per ADR-056) ---
// The gateway STORES a credential and never judges one: verification lives in control-api, which is
// already the authentication boundary and already holds the KDF (internal/identity). Putting the KDF
// here too would give one rule two implementations, which is the drift this milestone exists to remove.
message User {
  string user_id = 1;
  string name = 2;       // unique, the login handle
  string pw_hash = 3;    // internal/identity format; opaque to the gateway
  bool is_admin = 4;     // may create and remove other accounts
  string created_at = 5;
  bool found = 6;        // false => no such user (GetUser)
}
// Either field identifies: login has a name, everything else has an id.
message UserRef { string user_id = 1; string name = 2; }
message UserList { repeated User users = 1; int64 total = 2; }

// --- metrics (time-series ingested from results; trends for M15) -------------
message MetricPoint {
  string run_id = 1;
  double ts = 2;
  string name = 3;
  double value = 4;
  string labels_json = 5;
  string owner = 6;   // ADR-109: inherited from the run, so a trend is one account's numbers
}
message MetricsBatch { repeated MetricPoint points = 1; }
message MetricsQuery {
  string name = 1;
  double since_ts = 2;
  double until_ts = 3;
  int64 limit = 4;
}
message MetricsSeries { repeated MetricPoint points = 1; }
message TrendReq {
  string metric = 1;
  int64 window = 2; // last N runs (0 => a sane default)
  string owner = 3; // ADR-109: "" => every row (a machine token)
}
message TrendPoint { string run_id = 1; double ts = 2; double value = 3; }
message TrendReply { repeated TrendPoint points = 1; }

// --- config (M11.5 PR-5, ADR-062: the SERVICE tier of the tiered config, ADR-049) -------------
// A key -> JSON document store. The standalone tier keeps using a file (brain/runconfig.py); this
// domain is what a service deployment reads at start and the setup wizard writes.
// SECRETS ARE REJECTED, not stripped: PutConfig fails with InvalidArgument when value_json carries a
// secret-shaped key anywhere in the document. Keys live in the process env, never in the store.
message ConfigRecord {
  string key = 1;
  string value_json = 2; // a JSON object; secret-shaped member names are refused
  string updated_at = 3; // RFC3339 (defaulted on write)
  bool found = 4;        // false => no such key (GetConfig)
}
message ConfigKey { string key = 1; }
message ConfigList { repeated ConfigRecord items = 1; }

// --- purge (ADR-100): explicitly-invoked cleanup of stored foreign text ------------------------
// Redaction-on-write cannot help what was written BEFORE it existed (ADR-098/099 closed the trace;
// this closes the store). Cleanup here means DELETING ROWS, not blanking fields: nearly all foreign
// text in this store is INHERENT — a locator IS the page's text ({"role":"button","name":"Pay now"}),
// so blanking it would break healing rather than protect anything. See docs/DB_FOREIGN_TEXT.md.
//
// This RPC is never called automatically. It has no place in agentctl's start-of-run sweep block
// (sweepTraces/sweepLogs/sweepRuns): a swept trace is reproducible by re-running, healing history is
// not, and an automatic purge would make "the tool tidied up" indistinguishable from "evidence was
// erased".
message PurgeReq {
  // Required and non-empty. An empty scope is REFUSED, never taken to mean "everything".
  repeated string tables = 1;
  // Epoch seconds. 0 => no age filter (every row of the named tables). The server maps this onto
  // each table's own time column, which is REAL epoch in the heal schema and RFC3339 TEXT in M13.
  double older_than_epoch = 2;
  // THE DEPLOYER'S CHOICE, and both answers are legitimate:
  //   false — rows leave the queries, but THE BYTES REMAIN in freed pages (measured: modernc
  //           sqlite v1.53.0 defaults to secure_delete=0, so a deleted row is still greppable).
  //   true  — the bytes are gone, AND SO IS RECOVERABILITY: VACUUM rewrites the file, which some
  //           organizations must not do. We do not choose this for them.
  bool vacuum = 3;
}
message PurgeTableCount {
  string table = 1;
  int64 rows = 2;
}
message PurgeReport {
  repeated PurgeTableCount counts = 1;
  bool vacuumed = 2;
  // Non-empty when vacuum was asked for but not performed — a skipped scrub must never be silent.
  string vacuum_skipped = 3;
  // What the caller just gave up, named out loud (ARCHITECTURE principle 7): purging healing_audit
  // blinds `agentctl calibrate`, purging healed_locators resets the heal cache, and so on.
  repeated string capabilities_lost = 4;
}

service StoreService {
  // runs
  rpc UpsertRun(RunRecord) returns (Empty);
  rpc GetRun(RunId) returns (RunRecord);
  rpc ListRuns(ListRunsReq) returns (RunList);
  // scenarios / tests
  rpc SaveScenario(Scenario) returns (Empty);
  rpc GetScenario(ScenarioId) returns (Scenario);
  rpc ListScenarios(ListScenariosReq) returns (ScenarioList);
  rpc DeleteScenario(ScenarioId) returns (Empty); // M14 wave W3: library mgmt, idempotent (missing id -> success)
  rpc PromoteTest(PromoteReq) returns (TestRecord);
  rpc GetTest(TestId) returns (TestRecord);
  rpc ListTests(ListTestsReq) returns (TestList);
  rpc DeleteTest(TestId) returns (Empty); // M14 wave W3
  // chats (projection)
  rpc UpsertChat(ChatProjection) returns (Empty);
  rpc GetChat(ConversationId) returns (ChatProjection);
  rpc ListChats(ListChatsReq) returns (ChatList);
  rpc DeleteChat(ConversationId) returns (Empty); // M14 wave W3
  // results
  rpc SaveResult(ResultRecord) returns (Empty);
  rpc GetResult(RunId) returns (ResultRecord);
  rpc ListResults(ListResultsReq) returns (ResultList);
  // metrics
  rpc IngestMetrics(MetricsBatch) returns (Empty);
  rpc QueryMetrics(MetricsQuery) returns (MetricsSeries);
  rpc Trends(TrendReq) returns (TrendReply);
  // config (M11.5 PR-5)
  rpc PutConfig(ConfigRecord) returns (Empty);   // InvalidArgument when value_json carries a secret
  rpc GetConfig(ConfigKey) returns (ConfigRecord);
  rpc ListConfig(Empty) returns (ConfigList);
  rpc DeleteConfig(ConfigKey) returns (Empty);   // idempotent, like DeleteScenario/DeleteTest/DeleteChat
  // purge (ADR-100) — operator-invoked only; InvalidArgument on an empty or unknown scope
  rpc PurgeStore(PurgeReq) returns (PurgeReport);

  // ADR-109 local accounts.
  rpc UpsertUser(User) returns (Empty);
  rpc GetUser(UserRef) returns (User);
  rpc ListUsers(Empty) returns (UserList);
  rpc DeleteUser(UserRef) returns (Empty);
}
