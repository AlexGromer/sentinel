<!-- L12 — документ БЕЗ <body>.
     В корпусе не было ни одной такой страницы, и это стоило прогона: обход дошёл до
     `the-internet/nested_frames`, снимок безусловно ждал `locator('body')` пять секунд и валил
     весь прогон с exit 4, потеряв 45 шагов работы.
     Тонкость, ради которой фикстура нужна именно такой: по спецификации HTML `document.body` здесь
     возвращает НЕ null, а сам <frameset> («первый ребёнок html, который либо body, либо frameset»).
     JS, читающий document.body, тут работает — а CSS-селектор `body` не матчит, потому что сравнивает
     имя тега. Расхождение видно только на живой странице, поэтому фикстура, а не юнит.
     Внутри фреймов есть и ссылки, и кнопка: `browser.links` до ADR-095 не пересекал границу фрейма и
     возвращал пустоту, неотличимую от «ссылок нет». -->
<frameset frameborder="1" rows="50%,50%">
  <frame src="l12-frame-top.html" name="l12-top">
  <frame src="l12-frame-bottom.html" name="l12-bottom">
  <noframes>Frames are not rendering.</noframes>
</frameset>
