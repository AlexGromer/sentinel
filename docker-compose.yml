# Sentinel — one-command quickstart (Foundation cycle).
#
#   docker compose build
#   docker compose up                            # THE PRODUCT: control-api + store + browser + hub
#   docker compose run --rm sentinel run --target "file:///app/testdata/site/index.html"
#   docker compose --profile demo up             # bundled zero-dep explore -> runs/demo/plan.json
#   docker compose --profile ollama up -d ollama # optional local-model endpoint (OpenAI-compat /v1)
#
# WHY `up` STARTS FOUR SERVICES AND NOT ONE (Alex's decision 2026-08-03). Until now every
# long-running service sat behind its own profile, so the command in the README started nothing a
# person could open. Four profiles had to be typed in the right combination before the product
# existed, and the newest feature — the live view — needed the one profile nobody would guess.
# A default that is not the product teaches the wrong thing about the product.
#
# What stays behind a profile is what a deployment genuinely may not want: a local model (`ollama`,
# `litellm` — heavy, and usually already running elsewhere), the bundled fixture run (`demo`), and
# the one-shot CLI (`cli`). The CLI needs no flag anyway: `docker compose run` enables the target
# service's own profiles, so `run --rm sentinel …` above works unchanged (verified, not assumed).
#
# Model selection is config-only (ADR-019): set the LLM_* env block below or per-run. With no key
# set, the run falls back to the deterministic heuristic planner / L1–L6 heal (still useful offline).
# See docs/LOCAL_MODELS.md for the model/runtime catalog and docs/TESTING.md for the full guide.

# Log rotation for EVERY service (HEALTH-005 PR-C). Measured before this existed: no `logging:` key
# anywhere, so each container inherited the daemon's default driver — usually json-file with NO size
# limit — and the log of a long-lived control-api grew until the disk did. Worse for the operator:
# `docker compose down` destroys those logs entirely, so the one place a container's own output lived
# was also the place it did not survive.
#
# Written as its own anchor and referenced EXPLICITLY by each service rather than folded into the
# image anchor below. That is not style: a YAML merge key REPLACES a mapping instead of deepening it,
# so a service that later declares its own `logging:` would silently lose the inherited one — the
# exact defect that cost this project a live debugging session when `environment:` did it to
# PW_CDP_ENDPOINT. One line per service is immune to that, and a gate can assert it by counting.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared base for the agent image (DRY via YAML anchor).
x-sentinel-base: &sentinel-base
  build:
    context: .
  image: sentinel:local
  # Run as the INVOKING operator, not as root (HEALTH-005 PR-C). Measured: the image declares no
  # USER, so `docker run` gives uid 0, and everything the container CREATES under ./runs and ./state
  # is root-owned on the host. That is not a cosmetic annoyance — it cannot be cleaned up without
  # sudo (renaming a directory writes to the directory itself, so owning the parent does not help),
  # it breaks `go test ./...` on a checkout, and it made the service journal this milestone added
  # UNREADABLE from the host: `-rw-r----- root root`, on the one deployment we actually recommend.
  #
  # ⚠ UID/GID are SHELL variables, not environment variables. `docker compose` reads the environment
  # and .env, so without `export UID GID` (or the lines in .env.example) the substitution silently
  # yields 1000 for everyone. Named here because a knob that looks like it reads your uid and does
  # not is worse than no knob.
  #
  # ⚠ Measured, so it is not set defensively — and RE-measured on 2026-08-14 when ADR-124 swapped the
  # runtime base from the Playwright image to `node:24-bookworm-slim`. What changed: uid 1000 is now
  # `node` (home /home/node, writable) and uid 1001 has NO passwd entry at all, where the old base
  # listed both as `pwuser`-family. What did NOT change is the conclusion: a run under uid 1000
  # succeeds with the same plan_hash as before, and an unlisted uid fails on the HOST ownership of
  # ./runs — identically on both bases, verified side by side — not on HOME. Chromium launches
  # regardless, because it puts its user-data-dir under /tmp. So no HOME override is needed, and none
  # is set.
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ./runs:/app/runs       # plan.json / transcript / heal-report / scenario.json / trace.zip
    - ./state:/app/state     # locator/golden/quarantine SQLite + store-gateway socket
    - ./config:/config       # mount a RunConfig YAML or plan.json (e.g. --run-config /config/run.yaml)
  environment:
    # Cloud default (Anthropic) — optional; absent key -> offline heuristic/L1–L6 fallback.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # ADR-110: attach to the `browser` service below instead of launching a browser inside this
    # container. Empty (default) = each run launches its own, unchanged. Set it to use the service:
    #   PW_CDP_ENDPOINT=http://browser:9223 docker compose --profile browser up -d browser
    PW_CDP_ENDPOINT: ${PW_CDP_ENDPOINT:-}
    # --- Local model via the optional `ollama` service (uncomment to enable) -------------------
    # LLM_BACKEND: openai
    # LLM_BASE_URL: http://ollama:11434/v1
    # LLM_MODEL: ${LLM_MODEL:-}          # pick one from docs/LOCAL_MODELS.md §3
    # LLM_API_KEY: noauth                # Ollama ignores the key; the SDK requires a non-empty value
    # LLM_VISION: ${LLM_VISION:-0}       # set 1 only for a vision-capable heal model
    # --- or via the optional `litellm` multi-provider router (ADR-045; see docs/ADAPTERS.md) ----
    # LLM_BACKEND: openai
    # LLM_BASE_URL: http://litellm:4000/v1
    # LLM_MODEL: deepseek-chat           # a model_name from deploy/litellm/config.yaml
    # LLM_API_KEY: ${LITELLM_MASTER_KEY:-}  # the proxy's master_key

services:
  # Primary entrypoint. ENTRYPOINT is /app/bin/agentctl — append subcommands after the name:
  #   docker compose run --rm sentinel run --target <URL> [--goal "..."] [--planner heuristic|llm|goal]
  #   docker compose run --rm sentinel run --target <URL> --run-config /config/run.yaml
  # `cli` rather than no profile: this container runs one command and exits, so leaving it in the
  # default set would make `docker compose up` end with an exited container next to the four that
  # are meant to stay. `docker compose run --rm sentinel …` enables the profile itself.
  sentinel:
    logging: *logging
    <<: *sentinel-base
    profiles: ["cli"]
    command: ["--help"]
    # NO browser-service default here, deliberately, unlike control-api below. `docker compose run`
    # starts the target service and its declared dependencies — not the rest of the stack — so a
    # default endpoint would make the zero-dependency one-shot fail against a service that is not
    # running, and it fails HARD by design (an unreachable CDP endpoint must not silently fall back
    # to a browser nobody asked for: tests/test_cdp_endpoint_offline.py). Set PW_CDP_ENDPOINT
    # yourself to point a CLI run at the service.

  # Zero-external-dependency demo: deterministic explore against a bundled fixture.
  # Swap the target for testdata/fixtures/l1..l5.html to exercise login/validation/tabs/shadow-DOM.
  demo:
    logging: *logging
    <<: *sentinel-base
    profiles: ["demo"]
    command:
      - "run"
      - "--target"
      - "file:///app/testdata/site/index.html"
      - "--planner"
      - "heuristic"
      - "--artifact-dir"
      - "/app/runs/demo"

  # Optional local-model endpoint (OpenAI-compatible at http://ollama:11434/v1).
  # `docker compose --profile ollama up -d ollama`, then `docker compose exec ollama ollama pull <model>`.
  ollama:
    logging: *logging
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  # Optional model-router (OpenAI-compatible at http://litellm:4000/v1) over many providers — ADR-045.
  # `docker compose --profile litellm up -d litellm`; routing + provider keys in deploy/litellm/config.yaml.
  # Then drive Sentinel with LLM_BACKEND=openai LLM_BASE_URL=http://litellm:4000/v1 (see docs/ADAPTERS.md).
  litellm:
    logging: *logging
    image: docker.litellm.ai/berriai/litellm:latest
    profiles: ["litellm"]
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # config.yaml reads these via os.environ/<VAR> — passthrough from the host, never a literal key.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
    ports:
      - "4000:4000"

  # Local, air-gapped setup-WebUI + chat-front + calculators (bundled into the image under /app/docs).
  #   docker compose up   →   open http://localhost:8088/setup/  (also /chat/ and /calculators/)
  # Static files only; no network, no API key — the generators run entirely in your browser.
  # The chat-front (/chat/) drives the `control-api` service below for live authoring/runs (ADR-040).
  webui:
    logging: *logging
    <<: *sentinel-base
    entrypoint: ["/app/.venv/bin/python", "-m", "http.server", "8088", "--directory", "/app/docs"]
    ports:
      - "8088:8088"

  # Non-MCP HTTP control-API (M9.3, ADR-032) — start a run / poll status over HTTP. Published ONLY to
  # host localhost (127.0.0.1:8090); inside the container it binds 0.0.0.0 so the port map works.
  #
  # THREE DEPLOYMENT MODES (ADR-064) — the difference is only who serves the browser UI:
  #
  #   1 · headless  — no UI at all (CI, scripts, an MCP host). One port, no CORS.
  #       docker compose up control-api
  #
  #   2 · split (the default here) — the `webui` service above serves the pages on :8088, this API
  #       answers on :8090. Two origins, so CONTROL_API_CORS_ORIGINS must list the UI's origin, and
  #       the token is copy-pasted into the page's Settings field.
  #       docker compose up
  #
  #   3 · single-service (recommended) — control-api serves the UI from its OWN port. One port,
  #       same-origin (so the CORS allowlist can be emptied), and the page picks up its token from
  #       the one-time ?bootstrap=<nonce> link printed at startup.
  #       CONTROL_API_SERVE_UI=1 CONTROL_API_CORS_ORIGINS= \
  #         docker compose up control-api                            → http://localhost:8090/
  #
  # The bearer token is no longer something you must invent first (ADR-064): unset, control-api
  # generates one and persists it to ./state/control-api.token (0600), reusing it across restarts.
  # Set CONTROL_API_TOKEN to manage it yourself, or CONTROL_API_AUTOTOKEN=0 for a read-only instance.
  control-api:
    logging: *logging
    <<: *sentinel-base
    entrypoint: ["/app/bin/control-api"]
    # Every default below uses `${VAR-fallback}` (a single dash, not `:-`): setting the variable to
    # an EMPTY value opts out and keeps the previous standalone behaviour, while leaving it unset
    # gets the wired stack. `:-` would substitute the fallback for an explicit empty too, so there
    # would be no way to say "no store" / "no browser" from the environment.
    environment:
      CONTROL_API_ADDR: "0.0.0.0:8090"
      CONTROL_API_AGENTCTL: /app/bin/agentctl
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:-}
      CONTROL_API_CORS_ORIGINS: ${CONTROL_API_CORS_ORIGINS-http://localhost:8088,https://alexgromer.github.io}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # ADR-064 mode 3: serve the embedded UI from this port. Empty/unset = modes 1-2 (unchanged).
      CONTROL_API_SERVE_UI: ${CONTROL_API_SERVE_UI:-}
      # ADR-062/063 service tier: the `store-gateway` service below. Defaulted rather than left to
      # the operator because the gateway is now part of the default stack, and control-api probes it
      # ONCE at startup — a miss is remembered for the process lifetime (cmd/control-api/store.go::
      # newStoreClient), which is why `depends_on` waits for it to be healthy instead of racing.
      CONTROL_API_STORE_ADDR: ${CONTROL_API_STORE_ADDR-unix:/app/state/store.sock}
      # ADR-126: where the RunControl orchestrator listens. ONE address for the deployment, not one
      # per run — the old per-run socket (`state/sentinel-orch-<id>.sock`) could never be named here,
      # because this variable is read ONCE at startup. Empty = no orchestrator, and every run then
      # behaves exactly as it did before: supervision is an addition, never a precondition.
      CONTROL_API_ORCH_ADDR: ${CONTROL_API_ORCH_ADDR-unix:/app/state/orch.sock}
      # ADR-111: where the live VIDEO mode gets its frames — the `browser` service's live port.
      # Empty means this deployment has no browser service, and the UI says exactly that instead of
      # showing an empty box.
      CONTROL_API_CDP_LIVE: ${CONTROL_API_CDP_LIVE-http://browser:9224}
      # ⚠ MEASURED DEFECT, fixed here. This service defines its own `environment:` block, and a YAML
      # merge key replaces that mapping wholesale rather than deepening it — so PW_CDP_ENDPOINT from
      # the *sentinel-base anchor never reached control-api at all. Every run started through the
      # API (which is every run started from the UI) therefore launched its own browser, and the
      # live view could only ever show the browser service's own idle page, never the run's. The
      # documented `PW_CDP_ENDPOINT=… docker compose --profile browser up -d browser` set it on the
      # browser service, which ignores it. `PW_` passes agentctl's env allowlist, so naming it here
      # is all that is needed (cmd/agentctl/main.go::filteredEnv).
      PW_CDP_ENDPOINT: ${PW_CDP_ENDPOINT-http://browser:9223}
    # `service_healthy`, not `service_started`, for both: the store is probed once at startup (see
    # above), and an unreachable CDP endpoint fails a run HARD by design rather than falling back to
    # a browser nobody asked for (tests/test_cdp_endpoint_offline.py). Waiting costs a few seconds
    # once; racing costs a stack that is up and quietly half-wired.
    depends_on:
      store-gateway:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      browser:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"

  # ADR-126 — the RunControl orchestrator, at last with something starting it.
  #
  # It was built by M8 (ADR-021) and packaged into the .deb ever since, while NOTHING launched it: it
  # is absent from every compose file, from the Dockerfile and from install.sh. So takeover/return
  # (ADR-054) and the map gate (ADR-108c) were dead in every shipped configuration — `forwardControl`
  # answered "no orchestrator wired" because CONTROL_API_ORCH_ADDR was set nowhere.
  #
  # No `environment:` block here ON PURPOSE. The anchor carries ANTHROPIC_API_KEY and PW_CDP_ENDPOINT,
  # and a YAML merge key REPLACES a mapping rather than deepening it — declaring one line of our own
  # would silently drop both. That is not hypothetical: it is the measured defect recorded on
  # control-api above. This service needs none of the anchor's variables, so it declares none.
  orchestrator:
    logging: *logging
    <<: *sentinel-base
    entrypoint: ["/app/bin/orchestrator", "--serve", "--addr", "/app/state/orch.sock"]
    # Same readiness signal, and the same reasoning, as store-gateway: control-api dials this path, so
    # the path EXISTING is what "ready" means. The service removes it on shutdown, because a socket
    # that answers nothing is indistinguishable from a healthy one to everything except a real call.
    healthcheck:
      test: ["CMD-SHELL", "test -S /app/state/orch.sock"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  # Dedicated store-gateway for the control-API config/runs domains (M13, ADR-062) — the SERVICE tier.
  # Enables PUT/GET /v1/config and persisted-config-driven runs (ADR-063). Listens on a Unix socket in the
  # shared ./state volume; control-api reaches it via CONTROL_API_STORE_ADDR=unix:/app/state/store.sock,
  # which is now the default rather than something to remember.
  # Both services run the same image (same UID), so the store-gateway peer-cred guard accepts control-api;
  # cross-container socket sharing over ./state is verified on the live host. --no-auth keeps the local
  # demo keyless (the socket is already owner-restricted, 0600 + peer-cred).
  store-gateway:
    logging: *logging
    <<: *sentinel-base
    entrypoint: ["/app/bin/store-gateway", "--addr", "/app/state/store.sock", "--db", "/app/state/control-store.db", "--no-auth"]
    # The socket EXISTING is the readiness signal control-api actually depends on — it dials that
    # path and gives up on the first miss. Testing the file rather than the process also survives a
    # stale socket left by an unclean shutdown: the gateway unlinks and re-creates it on start.
    healthcheck:
      test: ["CMD-SHELL", "test -S /app/state/store.sock"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  # A Chromium that OUTLIVES a run, reachable over CDP by everything else in this stack (ADR-110).
  # Until now every run launched a browser inside its own process, so there was nothing for a second
  # consumer — the live view, a co-pilot session — to attach to.
  #
  #   docker compose up -d browser        # control-api is already pointed at it by default
  #   PW_CDP_ENDPOINT=http://browser:9223 docker compose run --rm sentinel \
  #     run --target <URL> --planner heuristic
  #
  # Chromium is NOT started directly here: it binds its debugging port to 127.0.0.1 and silently
  # ignores --remote-debugging-address, so a sibling container could never reach it. cdp-service.js
  # launches it through Playwright and relays the port — the reasoning, and the two other Chrome
  # behaviours that shape it, are documented at the top of pw-executor/src/cdp-service.ts.
  #
  # ⚠ NO `ports:` KEY, DELIBERATELY. CDP has no authentication and cannot be given any: whoever
  # reaches this port drives the browser, reads its pages and its cookies. Publishing it to the host
  # turns it into a remote-control surface. Note what "not published" does and does not buy you: it
  # keeps the port off the host's published interfaces, but a Docker bridge is routable FROM the
  # Linux host itself, so the trust boundary is "who can reach this machine's docker network", not
  # "who can reach localhost". Do not put this stack on a shared/multi-tenant host as-is.
  browser:
    logging: *logging
    <<: *sentinel-base
    entrypoint: ["node", "/app/pw-executor/dist/cdp-service.js"]
    # /live/status answers 200 whether or not a page is open (cdp-service.ts), so it reports that the
    # SERVICE is up without also demanding that a run be in progress. Chromium's first launch is the
    # slow part, hence the generous start_period. `node` rather than curl: node is guaranteed present
    # in this image, curl is not, and a healthcheck that depends on a package we never declared would
    # report unhealthy for the wrong reason.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:9224/live/status',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  # -------------------------------------------------------------------------------------------------
  # LIVE-VNC (W3, ADR-127) — the "real screen": a HEADED Chromium on a virtual X display, exported over
  # VNC. The only transport where the cursor is REAL rather than drawn, and the one that makes takeover
  # (ADR-054) something a person can actually do with a mouse.
  #
  #   docker compose --profile vnc up -d browser-vnc
  #   PW_CDP_ENDPOINT=http://browser-vnc:9223 docker compose run --rm sentinel run --target <URL>
  #   password: SENTINEL_VNC_PASSWORD, or the generated ./state/vnc.password (0600)
  #
  # ⚠ THE DEFAULT `browser` SERVICE ABOVE STAYS HEADLESS AND IS NOT TOUCHED (Alex, 2026-08-16). A
  # headed Chromium renders DIFFERENT pixels, and `screenshot_hash` is byte-stable ONLY in headless
  # (docs/DETERMINISM.md) — flipping the default service would invalidate every golden ever taken,
  # silently, on the next replay. Two services, one image: the profile decides what RUNS, and after the
  # 2026-08-17 measurement (+10 MB for x11vnc, because the X stack is already here for Chromium) there
  # is nothing left for it to decide about what is INSIDE the image.
  #
  # ⚠ NO `<<: *sentinel-base` HERE, and that is a decision rather than an oversight. This service must
  # declare an `environment:` block of its own, and a YAML merge key REPLACES that mapping instead of
  # deepening it — inheriting the anchor and then writing one line would drop ANTHROPIC_API_KEY and
  # PW_CDP_ENDPOINT without a word. That is not hypothetical: it is the measured defect recorded on
  # control-api above. Written out, there is no merge left to lose.
  browser-vnc:
    logging: *logging
    profiles: ["vnc"]
    build:
      context: .
      # Named for the same reason every other build site now names it (tests/test_build_targets_offline.py):
      # a build that names no target takes whatever stage the Dockerfile ends with, which is a property
      # of stage ORDER rather than of this service.
      target: runtime
    image: sentinel:local
    # Same reasoning as *sentinel-base, and here it is load-bearing rather than tidy: this container
    # CREATES state/vnc.password on the host bind mount. As root that would be a 0600 secret owned by
    # root — unreadable by the operator it was generated FOR, and unremovable without sudo.
    user: "${UID:-1000}:${GID:-1000}"
    # docker's own tini as pid 1. The entrypoint EXECs into the browser service, which would otherwise
    # be pid 1 and would never reap Xvfb and x11vnc — the two children it did not spawn.
    init: true
    volumes:
      - ./runs:/app/runs
      - ./state:/app/state     # state/vnc.password (0600) is written here on first start
      - ./config:/config
    # BOTH keys deliberately: compose CLEARS the image's CMD when `entrypoint:` is overridden, so the
    # command has to be repeated — and repeating it is what makes "what actually runs" readable here
    # instead of only in the Dockerfile.
    entrypoint: ["/app/bin/vnc-entrypoint.sh"]
    command: ["node", "/app/pw-executor/dist/cdp-service.js"]
    environment:
      # ⚠ EVERY key of *sentinel-base is repeated here ON PURPOSE — see the block comment above.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PW_CDP_ENDPOINT: ${PW_CDP_ENDPOINT:-}
      # The virtual display Xvfb creates and Chromium draws into. x11vnc finds it over the unix socket
      # /tmp/.X11-unix/X99 — Xvfb runs with -nolisten tcp, so the X server has no network socket at all
      # and nothing but this container's own processes can reach it.
      DISPLAY: ":99"
      SENTINEL_VNC_GEOMETRY: ${SENTINEL_VNC_GEOMETRY:-1280x800x24}
      # ⚠ WITHOUT THIS LINE THE WHOLE PROFILE IS A BLACK SCREEN WITH GREEN PROBES. cdp-service.js calls
      # chromium.launch(), and until LIVE-VNC that call passed no headless option at all — Playwright's
      # default is HEADLESS, and a headless Chromium draws nothing onto :99 while x11vnc faithfully
      # exports an empty desktop and /live/status answers 200. The variable is the one
      # resolveLaunchPlan already reads (pw-executor/src/launch.ts), not a new dialect.
      PW_HEADED: "1"
      # ONE journal file for every service, told apart by `svc`. Both browser services run the same
      # binary, so without this they both write svc:"browser" and the field stops answering the
      # question it exists to answer.
      SENTINEL_SVC_NAME: browser-vnc
      # Path 1 of the two a password may arrive by. Unset — the default — means path 2: the entrypoint
      # asks `agentctl vnc-password`, which generates state/vnc.password 0600 and says where it put it.
      # "Neither" is impossible by construction: the verb exits 2 and `set -e` stops the container.
      SENTINEL_VNC_PASSWORD: ${SENTINEL_VNC_PASSWORD:-}
    # ⚠ NO `ports:` KEY, for the SAME reason as `browser` and one more besides. CDP (9223) is
    # unauthenticated by construction. RFB (5900) does carry a password — but VNC's classic auth is DES
    # over the FIRST EIGHT BYTES of it (measured against x11vnc 0.9.16: a server holding
    # `ABCDEFGH12345678` accepts `ABCDEFGH`), which is a lock, not a wall. Reachability stays the
    # control: both ports live on the compose network only, and the hub reaches the screen through
    # control-api's relay behind a bearer token. tests/test_compose_parity_offline.py derives this rule
    # from "runs cdp-service.js" rather than from the name `browser`, so this service is covered by
    # construction rather than by somebody remembering it.
    healthcheck:
      # BOTH halves, because either alone is a green tick with no subject: /live/status proves the
      # browser service is up (it would be up in headless too, showing nothing), and the RFB connect
      # proves x11vnc is actually exporting the display. A container that answers one and not the other
      # is precisely the state in which the operator opens the live view and sees black.
      test: ["CMD", "node", "-e", "const h=require('http'),n=require('net');h.get('http://127.0.0.1:9224/live/status',r=>{if(r.statusCode!==200)process.exit(1);const s=n.connect(5900,'127.0.0.1',()=>{s.destroy();process.exit(0)});s.on('error',()=>process.exit(1))}).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
      # 20s rather than the headless service's 10s: an X server plus a HEADED Chromium is measurably
      # slower to first paint. Measured live at ~12s to CDP_SERVICE_READY on this machine.
      start_period: 20s

volumes:
  ollama:
