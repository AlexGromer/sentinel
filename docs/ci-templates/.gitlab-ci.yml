# =============================================================================
# Sentinel UI-test gate — GitLab CI (TEMPLATE).
#
# RU: Шаблон для ВАШЕГО репозитория. Sentinel = CLI со структурными кодами выхода
#     (0/1/2/3). Подробности и таблица кодов: ci-templates/README.md.
# EN: A template for YOUR repository. Sentinel = a CLI with structured exit codes
#     (0/1/2/3). Details + exit-code table: ci-templates/README.en.md.
#
# Prereqs: Docker-in-Docker, a checkout of the Sentinel repo (or a published image once
# M11.1 lands), and a committed frozen `config/plan.json` (author via the chat-front /
# `--describe`, freeze via `agentctl baseline update --plan plan.json`).
# =============================================================================
stages:
  - build
  - test

variables:
  TARGET: "https://staging.example.test"   # app under test (override per environment)
  DOCKER_DRIVER: overlay2
  # ANTHROPIC_API_KEY: set as a masked CI/CD variable to enable LLM self-healing.
  # Absent key → deterministic heuristic planner + L1–L6 heal (offline, still useful).

build-sentinel:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker compose build sentinel

sentinel-replay:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  script:
    - echo "Replaying the frozen plan against $TARGET"
    # Replay a committed, frozen plan; `--ci` forbids bypassing the plan_hash hard-abort.
    # The job exits with sentinel's own code; allow_failure below maps exit 3 to a warning.
    - >
      docker compose run --rm
      -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY:-}"
      sentinel run --target "$TARGET" --replay --plan /config/plan.json --ci
      --aut-version "${CI_COMMIT_SHA:-unknown}"
    # ADR-090: build the reports. `agentctl report` is the sole producer of report.html, report.json,
    # metrics.prom and junit.xml — without this line the artifacts published below do not exist. It runs
    # even when the replay failed (`|| true` plus `- ` on the run above is not used here: GitLab stops
    # the script on error, so the report step is guarded explicitly), because a FAILED run is exactly
    # the one whose report someone wants to read.
    - >
      for d in runs/*/; do
        docker compose run --rm sentinel report --run "/$d" || true;
      done
  # 0 pass → success · 1 step-fail / 2 visual regression → failure · 3 config/plan-integrity,
  # 4 OUR tool crashed, 5 OUR tool crashed but saved its findings → warning.
  #
  # WHOSE PROBLEM IT IS decides this, not how bad it sounds. 1 and 2 are findings ABOUT YOUR
  # APPLICATION and should fail the pipeline. 3, 4 and 5 are not — 4 and 5 are Sentinel breaking, and a
  # red job there sends you to debug your own application, which is the one answer that is certainly
  # wrong. ⚠ Until ADR-141 this list held only 3, so exits 4 and 5 — both shipped, both reachable —
  # were a hard red. Measured 2026-08-31.
  allow_failure:
    exit_codes:
      - 3
      - 4
      - 5
  artifacts:
    when: always
    paths:
      - runs/
    # ADR-090: publish the JUnit report GitLab already knows how to read. junit.xml has existed since
    # ADR-073 as "the machine contract every CI consumes", and this template — the first thing a new
    # user copies — consumed nothing: it archived the directory and left the results invisible in the
    # pipeline view. A contract nobody is wired to is a file.
    # Note the glob: one file per run directory, and GitLab merges them.
    reports:
      junit: runs/*/junit.xml
