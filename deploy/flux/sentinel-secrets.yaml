# Source for the `sentinel-secrets` Secret that the chart's secretKeyRef reads (M11.3 / ADR-035).
#
# This is a TEMPLATE — it ships with BOTH options COMMENTED OUT on purpose: the sync.yaml Kustomization
# bulk-applies this directory with `wait: true`, so an active ExternalSecret/SealedSecret on a cluster
# that lacks the operator CRDs (External Secrets Operator / sealed-secrets) would fail to apply and
# STALL the whole reconcile (incl. the HelmRelease). Uncomment exactly ONE option, wire it to your
# backend, then commit. (Or hand-create the Secret: see docs/DEVELOPMENT.md §Secret plumbing.)
#
# The produced Secret MUST be named `sentinel-secrets` in namespace `sentinel` with keys
# `llm-api-key` / `checkpoint-dsn` (+ any extraSecretEnv keys) to match the chart's secretKeyRef.

# --- Option A: External Secrets Operator — pulls values from Vault / AWS SM / GCP SM / etc. ---
#   apiVersion external-secrets.io/v1 is GA in ESO >= 0.10; for older operators use .../v1beta1.
# apiVersion: external-secrets.io/v1
# kind: ExternalSecret
# metadata:
#   name: sentinel-secrets
#   namespace: sentinel
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: sentinel-store        # VERIFY: your ClusterSecretStore / SecretStore (Vault, AWS SM, …)
#     kind: ClusterSecretStore
#   target:
#     name: sentinel-secrets      # the K8s Secret produced — matches secrets.*.secretName in values
#     creationPolicy: Owner
#   data:
#     - secretKey: llm-api-key    # matches secrets.llmApiKey.key
#       remoteRef:
#         key: sentinel/llm-api-key       # path in YOUR backend
#     - secretKey: checkpoint-dsn # matches secrets.checkpointDsn.key
#       remoteRef:
#         key: sentinel/checkpoint-dsn
#     # - secretKey: aut-password # matches a secrets.extraSecretEnv[].key
#     #   remoteRef:
#     #     key: sentinel/aut-password

# --- Option B: Bitnami SealedSecret — encrypt with `kubeseal`; the encrypted blob is git-safe. ---
#   Produce each value with:  echo -n "$VALUE" | kubeseal --raw --namespace sentinel --name sentinel-secrets
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: sentinel-secrets
#   namespace: sentinel
# spec:
#   encryptedData:
#     llm-api-key: CHANGEME-sealed-blob
#     checkpoint-dsn: CHANGEME-sealed-blob
#   template:
#     metadata:
#       name: sentinel-secrets
#       namespace: sentinel
#     type: Opaque
